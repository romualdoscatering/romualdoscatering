function openModal(html, handlers = {}, mount) { MH = handlers; $('#mbox').innerHTML = html; $('#modal').classList.add('open'); if (mount) mount($('#mbox')); const f = $('#mbox').querySelector('input:not([type=checkbox]),select,textarea'); if (f && window.innerWidth > 700) f.focus(); }
function closeModal() { $('#modal').classList.remove('open'); $('#mbox').innerHTML = ''; MH = {}; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); const b = e.target.closest('[data-mact]'); if (!b) return; const k = b.dataset.mact; if (k === 'close') closeModal(); else MH[k]?.(b); });
let tT; function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(tT); tT = setTimeout(() => t.style.display = 'none', err ? 5000 : 2600); }
const mBtns = (save = 'Save', extra = '') => `<div class="row end" style="margin-top:14px">${extra}<button data-mact="close">Cancel</button><button class="pri" data-mact="save">${save}</button></div>`;

/* ============ writes ============ */
function needDb() { if (!S.me) { toast('Please log in.', true); return false; } return true; }
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
async function opsWrite(ops) { const r = await api('opsWrite', {ops}); applyDocs(r.docs, false); return r; }
async function addDoc(coll, data) { const id = genId(); await opsWrite([{op: 'add', path: coll + '/' + id, data}]); return id; }
const upd = (path, data) => opsWrite([{op: 'update', path, data}]);
const setDoc = (path, data) => opsWrite([{op: 'set', path, data}]);
async function guard(fn, ok) {
  if (S.busy || !needDb()) return false; S.busy = true; document.body.style.cursor = 'progress'; toast('Saving…');
  try { await fn(); if (ok) toast(ok); return true; }
  catch (e) { console.error(e); if (!e.auth) toast('Not saved: ' + (e?.message || e), true); return false; }
  finally { S.busy = false; document.body.style.cursor = ''; render(); }
}

/* ============ actions ============ */
ACT.set = a => { const i = a.indexOf('|'); setPath(D, a.slice(0, i), a.slice(i + 1)); render(); };
ACT.more = k => { D.ui.showAll[k] = (D.ui.showAll[k] || 40) + 100; render(); };
ACT.addLine = k => { D[k].lines.push({itemId: '', qty: '', ...(k === 'purchase' || k === 'req' ? {cost: ''} : {})}); render(); setTimeout(() => { const ins = document.querySelectorAll(`[data-item^="${k}|"]`); ins[ins.length - 1]?.focus(); }, 30); };
ACT.rmLine = a => { const [k, i] = a.split('|'); D[k].lines.splice(+i, 1); if (!D[k].lines.length && k !== 'purchase') ACT.addLine(k); else render(); };
ACT.resetP = () => { D.purchase = newPurchase({book: D.purchase.book}); render(); };
ACT.rmLineOk = 1;
ACT.resetM = () => { D.move = newMove({book: D.move.book}); render(); };

ACT.saveAdv = () => {
  const d = D.advance;
  if (!d.to.trim() || !(num(d.amount) > 0)) return toast('Enter who received the cash and the amount.', true);
  guard(async () => { await addDoc('advances', {date: d.date, book: d.book, eventId: d.book === 'C' ? d.eventId : '', to: d.to.trim(), amount: r2(num(d.amount)), givenBy: d.givenBy.trim(), note: d.note.trim(), status: 'open'}); D.advance = newAdvance({book: d.book, givenBy: d.givenBy}); }, 'Cash advance recorded');
};
ACT.buyFor = id => {
  const a = S.advances.find(x => x.id === id); if (!a) return;
  D.purchase = newPurchase({book: a.book, eventId: a.eventId || '', buyer: a.to, advanceId: a.id, date: a.date >= today() ? today() : a.date});
  closeModal(); location.hash = 'purchases'; setTimeout(() => window.scrollTo(0, 0), 50);
  toast('Encode each item from the receipt: item, quantity and price per unit.');
};
ACT.expFor = id => {
  const a = S.advances.find(x => x.id === id); if (!a) return;
  D.purchase = newPurchase({book: a.book, eventId: a.eventId || '', buyer: a.to, advanceId: a.id, date: a.date >= today() ? today() : a.date, lines: [], other: [{cat: (S.config.expCats || [])[0] || 'Others', desc: '', amount: ''}]});
  closeModal(); location.hash = 'purchases';
};
ACT.liquidate = id => {
  const a = S.advances.find(x => x.id === id); if (!a) return;
  const s = advanceSpent(id), expect = num(a.amount) - s.spent, done = a.status === 'liquidated';
  openModal(`<h3>${done ? 'Liquidation' : 'Liquidate cash advance'}</h3>
   <p class="mut">${esc(a.to)} · ${chipBook(a.book, a.eventId)} · ${fmtD(a.date)} · advance ${peso(a.amount)}</p>
   ${done ? '' : `<div class="alert" style="margin:10px 0;display:block"><div><b>Step 1 — encode what was bought.</b> Every item from the receipt goes in as a line: item, quantity and price per unit. The app computes the amounts.</div><div class="row" style="margin-top:8px"><button class="sm pri" data-act="buyFor" data-arg="${a.id}">＋ Encode items bought</button><button class="sm" data-act="expFor" data-arg="${a.id}">＋ Add other expense (fare, ice, LPG)</button></div></div>`}
   <div class="tw"><table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Price / unit</th><th class="n">Amount</th></tr></thead><tbody>
    ${s.ps.map(p => `<tr class="cat-h"><th colspan="4"><span>${esc(p.supplier || 'Purchase')} · ${fmtD(p.date)}${p.receiptNo ? ' · OR ' + esc(p.receiptNo) : ' <span class="chip warn">no receipt</span>'}</span></th></tr>${(p.lines || []).map(l => `<tr><td>${esc(iname(l.itemId))}</td><td class="n">${fq(l.qty)} ${esc(iunit(l.itemId))}</td><td class="n">${peso(l.cost)}</td><td class="n">${peso(num(l.qty) * num(l.cost))}</td></tr>`).join('')}<tr><td colspan="3" class="small mut">Subtotal</td><td class="n"><b>${peso(p.total)}</b></td></tr>`).join('')}
    ${s.es.length ? `<tr class="cat-h"><th colspan="4"><span>Other expenses</span></th></tr>` + s.es.map(e => `<tr><td colspan="3">${esc(e.cat)} · ${esc(e.desc)}${e.receiptNo ? '' : ' <span class="chip warn">no receipt</span>'}</td><td class="n">${peso(e.amount)}</td></tr>`).join('') : ''}
    ${!s.ps.length && !s.es.length ? '<tr><td colspan="4" class="mut">Nothing encoded yet. Tap <b>Encode items bought</b> above first.</td></tr>' : ''}
   </tbody><tfoot><tr><td colspan="3">Cash advance</td><td class="n">${peso(a.amount)}</td></tr><tr><td colspan="3">Less: total bought &amp; spent</td><td class="n">${peso(s.spent)}</td></tr><tr><td colspan="3">Change that must be returned</td><td class="n">${peso(expect)}</td></tr></tfoot></table></div>
   ${done ? '' : '<p class="small mut" style="margin:10px 0 0"><b>Step 2 — count the change</b> the buyer hands back and enter it below.</p>'}
   ${done ? `<p>Change returned: <b>${peso(a.change)}</b> · received by ${esc(a.liqBy || '—')} · ${fmtT(a.liqAt)}<br>Unaccounted: <b class="${Math.abs(num(a.diff)) >= 1 ? 'bad-t' : 'ok-t'}">${Math.abs(num(a.diff)) >= 1 ? peso(a.diff) : 'none — balanced'}</b></p>${a.liqNote ? `<p class="small">${esc(a.liqNote)}</p>` : ''}<div class="row end"><button data-mact="close">Close</button></div>` : `
   <div class="grid" style="margin-top:12px"><label>Cash actually returned ₱<input id="m-chg" type="number" inputmode="decimal" step="any" min="0" value="${Math.max(0, r2(expect))}"></label><label>Received by<input id="m-by" list="dl-staff"></label></div>
   <div id="m-diff" class="alert"></div>
   <label>Explanation (required if it doesn't balance)<input id="m-note"></label>
   ${mBtns('Liquidate')}`}`,
   {save: () => {
     const chg = num($('#m-chg').value), diff = r2(num(a.amount) - s.spent - chg), note = $('#m-note').value.trim(), by = $('#m-by').value.trim();
     if (!by) return toast('Who received the change?', true);
     if (Math.abs(diff) >= 1 && !note) return toast('It doesn\'t balance — add an explanation.', true);
     guard(async () => { await upd('advances/' + id, {status: 'liquidated', change: r2(chg), spent: r2(s.spent), diff, liqNote: note, liqBy: by, liqAt: Date.now()}); closeModal(); }, Math.abs(diff) >= 1 ? 'Liquidated — flagged as not balanced' : 'Liquidated — balanced');
   }},
   box => { const upd = () => { const el = box.querySelector('#m-diff'); if (!el) return; const diff = r2(num(a.amount) - s.spent - num(box.querySelector('#m-chg').value)); el.className = 'alert ' + (Math.abs(diff) < 1 ? 'ok' : 'bad'); el.innerHTML = Math.abs(diff) < 1 ? '✓ Balanced' : diff > 0 ? `Short by <b>${peso(diff)}</b>: cash not returned and not covered by recorded purchases.` : `Over by <b>${peso(-diff)}</b>: recorded spending exceeds the advance (buyer used own money?).`; };
     box.querySelector('#m-chg')?.addEventListener('input', upd); upd(); });
};

ACT.unlinkPR = () => { D.purchase.prId = ''; D.purchase.prNo = ''; render(); };
ACT.addOther = () => { (D.purchase.other ||= []).push({cat: (S.config.expCats || [])[0] || 'Others', desc: '', amount: ''}); render(); };
ACT.rmOther = i => { D.purchase.other.splice(+i, 1); render(); };
ACT.saveP = () => {
  const d = D.purchase, raw = d.lines.filter(l => hasItem(l) && num(l.qty) > 0), other = (d.other || []).filter(o => num(o.amount) > 0);
  if (!raw.length && !other.length) return toast('Add at least one item or other cost.', true);
  if (raw.some(l => !(num(l.cost) > 0))) return toast('Enter the price per unit for every item.', true);
  if (d.lines.some(l => hasItem(l) && !(num(l.qty) > 0))) return toast('Some items have no quantity.', true);
  if ((d.other || []).some(o => (o.desc || '').trim() && !(num(o.amount) > 0))) return toast('Some other costs have no amount.', true);
  if (!d.buyer.trim()) return toast('Who bought it?', true);
  const L = advLeft(d);
  if (L && L.after < -0.5 && !confirm(`This is ${peso(-L.after)} more than what is left of ${L.a.to}'s cash advance. Save anyway?`)) return;
  guard(async () => {
    const R = resolveLines(raw), ops = [...R.ops], now = Date.now(), base = {date: d.date, book: d.book, eventId: d.book === 'C' ? d.eventId : '', receiptNo: d.receiptNo.trim(), advanceId: d.advanceId};
    let pid = '';
    if (R.lines.length) {
      pid = genId(); const total = r2(sum(R.lines, l => num(l.qty) * num(l.cost)));
      ops.push({op: 'add', path: 'purchases/' + pid, data: {...base, supplier: d.supplier.trim(), buyer: d.buyer.trim(), prId: d.prId || '', prNo: d.prNo || '',
        lines: R.lines.map(l => ({itemId: l.itemId, qty: num(l.qty), cost: num(l.cost), prevCost: costOf(l.itemId)})), total, status: 'received', recv: {by: d.buyer.trim(), at: now, qty: R.lines.map(l => num(l.qty)), auto: true}}});
      const seen = {}; R.lines.forEach(l => { if (num(l.cost) > 0 && num(S.items[l.itemId]?.lastCost) !== num(l.cost) && !R.ops.some(o => o.path === 'items/' + l.itemId)) seen[l.itemId] = num(l.cost); });
      Object.entries(seen).forEach(([iid, c]) => ops.push({op: 'update', path: 'items/' + iid, data: {lastCost: c}}));
    }
    other.forEach(o => ops.push({op: 'add', path: 'expenses/' + genId(), data: {...base, cat: o.cat || 'Others', desc: (o.desc || '').trim() || d.supplier.trim(), amount: r2(num(o.amount)), paidBy: d.buyer.trim(), purchaseId: pid}}));
    const pr = d.prId && S.prs.find(x => x.id === d.prId);
    if (pr && pr.status === 'approved') ops.push({op: 'update', path: 'prs/' + pr.id, data: {status: 'purchased', actual: {date: d.date, by: d.buyer.trim(), amount: r2(itemsTotal({lines: R.lines}) + sum(other, o => num(o.amount))), receipt: d.receiptNo.trim(), purchaseId: pid, at: now}}});
    await opsWrite(ops);
    D.purchase = newPurchase({book: d.book, date: d.date, buyer: d.buyer, advanceId: d.advanceId, eventId: d.eventId});
  }, d.advanceId ? 'Saved — added to stock and deducted from the cash advance' : 'Saved — items added to stock');
};
function purchaseTable(p, recvInputs) {
  return `<div class="tw"><table><thead><tr><th>Item</th><th class="n">Bought</th>${p.status !== 'pending' || recvInputs ? '<th class="n">Received</th>' : ''}<th class="n">Unit cost</th><th class="n">Amount</th></tr></thead><tbody>
   ${p.lines.map((l, i) => { const j = priceJump(l, l.prevCost); const rq = recvQty(p, i); return `<tr><td>${esc(iname(l.itemId))}${Math.abs(j) > pctAlert() ? ` <span class="chip ${j > 0 ? 'bad' : 'info'}">${j > 0 ? '▲' : '▼'} ${Math.abs(j).toFixed(0)}% vs ${peso(l.prevCost)}</span>` : ''}</td><td class="n">${fq(l.qty)} ${esc(iunit(l.itemId))}</td>
    ${recvInputs ? `<td><input class="m-rq" data-i="${i}" type="number" inputmode="decimal" step="any" min="0" value="${l.qty}" style="width:100px;text-align:right"></td>` : p.status === 'received' ? `<td class="n ${rq < l.qty - 0.001 ? 'bad-t' : ''}">${fq(rq)}</td>` : ''}
    <td class="n">${peso(l.cost)}</td><td class="n">${peso(l.qty * l.cost)}</td></tr>`; }).join('')}
  </tbody><tfoot><tr><td colspan="${p.status !== 'pending' || recvInputs ? 4 : 3}">Total</td><td class="n">${peso(p.total)}</td></tr></tfoot></table></div>`;
}
ACT.viewP = id => {
  const p = S.purchases.find(x => x.id === id); if (!p) return;
  openModal(`<h3>Purchase · ${esc(p.supplier || 'no supplier')}</h3>
   <p class="mut">${fmtD(p.date)} · ${chipBook(p.book, p.eventId)} · bought by <b>${esc(p.buyer)}</b> · receipt ${p.receiptNo ? esc(p.receiptNo) : '<span class="chip warn">none</span>'}${p.advanceId ? ' · from cash advance' : ''}</p>
   ${purchaseTable(p)}
   <p class="small mut">Entered ${fmtT(p.createdAt)}${who(p.createdBy) ? ' by ' + esc(who(p.createdBy)) : ''}.
   ${p.status === 'received' ? ` Received by <b>${esc(p.recv?.by)}</b> ${fmtT(p.recv?.at)}.${p.recv?.note ? ' Note: ' + esc(p.recv.note) : ''}` : ''}
   ${p.status === 'void' ? ` <span class="bad-t">Voided:</span> ${esc(p.voidReason)} (${esc(p.voidByName || '')}, ${fmtT(p.voidAt)})` : ''}</p>
   <div class="row end">${p.status === 'pending' ? `<button class="pri" data-mact="recv">Receive now</button>` : ''}<button data-mact="close">Close</button></div>`, {recv: () => ACT.receive(id)});
};
ACT.receive = id => {
  const p = S.purchases.find(x => x.id === id); if (!p || p.status !== 'pending') return;
  openModal(`<h3>Receive purchase</h3>
   <p class="mut">${fmtD(p.date)} · ${chipBook(p.book, p.eventId)} · ${esc(p.supplier || '—')} · bought by <b>${esc(p.buyer)}</b></p>
   <div class="alert info"><span class="ic">i</span><div>Weigh or count every item now. Change the received quantity if it's less than what the buyer recorded. Only the received quantity goes into stock.</div></div>
   ${purchaseTable(p, true)}
   <div class="grid" style="margin-top:10px"><label>Received by<input id="m-by" list="dl-staff"></label><label>Note<input id="m-note" placeholder="e.g. 0.3kg short on pork, wilted pechay"></label></div>
   <div id="m-warn"></div>
   ${mBtns('Confirm received')}`,
   {save: () => {
     const by = $('#m-by').value.trim(); if (!by) return toast('Enter who received the goods.', true);
     const qty = [...document.querySelectorAll('.m-rq')].map(el => num(el.value));
     guard(async () => {
       const ops = [{op: 'update', path: 'purchases/' + id, data: {status: 'received', recv: {by, at: Date.now(), qty, note: $('#m-note').value.trim()}}}];
       const seen = {}; p.lines.forEach(l => { if (S.items[l.itemId] && num(l.cost) > 0 && num(S.items[l.itemId].lastCost) !== num(l.cost)) seen[l.itemId] = num(l.cost); });
       Object.entries(seen).forEach(([iid, c]) => ops.push({op: 'update', path: 'items/' + iid, data: {lastCost: c}}));
       await opsWrite(ops);
       closeModal();
     }, 'Received into ' + BOOK[p.book].name + ' stock');
   }},
   box => { const by = box.querySelector('#m-by'); by.addEventListener('input', () => { box.querySelector('#m-warn').innerHTML = by.value.trim() && by.value.trim().toLowerCase() === (p.buyer || '').trim().toLowerCase() ? '<div class="alert warn"><span class="ic">⚠</span><div>The receiver is the same person as the buyer. This will be flagged for the owner.</div></div>' : ''; }); });
};

ACT.saveE = () => {
  const d = D.expense;
  if (!d.cat || !(num(d.amount) > 0)) return toast('Choose a category and enter the amount.', true);
  guard(async () => { await addDoc('expenses', {date: d.date, book: d.book, eventId: d.book === 'C' ? d.eventId : '', cat: d.cat, desc: d.desc.trim(), amount: r2(num(d.amount)), paidBy: d.paidBy.trim(), receiptNo: d.receiptNo.trim(), advanceId: d.advanceId, status: 'ok'}); D.expense = newExpense({book: d.book, date: d.date, paidBy: d.paidBy, advanceId: d.advanceId, eventId: d.eventId}); }, 'Expense saved');
};

ACT.saveM = () => {
  const d = D.move; { const R0 = d.lines.filter(l => !l.itemId && hasItem(l)); if (R0.length) return toast('“' + R0[0].newName + '” is not in stock yet. Choose an item from the list.', true); }
  const lines = d.lines.filter(l => l.itemId && num(l.qty) > 0);
  if (!lines.length) return toast('Add at least one item with a quantity.', true);
  if (d.book === 'C' && (d.type === 'issue' || d.type === 'return') && !d.eventId) return toast('Choose the event.', true);
  if (d.type === 'waste' && !d.reason) return toast('Choose a waste reason.', true);
  if (!d.by.trim() || !d.receivedBy.trim()) return toast('Enter both names (released by and received / witnessed by).', true);
  guard(async () => {
    await addDoc('moves', {date: d.date, book: d.book, type: d.type, toBook: d.type === 'transfer' ? (d.book === 'R' ? 'C' : 'R') : '', eventId: d.book === 'C' && (d.type === 'issue' || d.type === 'return') ? d.eventId : '',
      by: d.by.trim(), receivedBy: d.receivedBy.trim(), reason: d.type === 'waste' ? d.reason : '', note: d.note.trim(), lines: lines.map(l => ({itemId: l.itemId, qty: num(l.qty), cost: costOf(l.itemId)})), status: 'ok'});
    D.move = newMove({book: d.book, type: d.type, date: d.date, by: d.by, eventId: d.eventId});
  }, 'Saved');
};

ACT.void = a => {
  const [coll, id] = a.split('|'); const x = (S[coll] || []).find(r => r.id === id); if (!x) return;
  if (coll === 'purchases' && x.advanceId && S.advances.find(v => v.id === x.advanceId)?.status === 'liquidated') return toast('This purchase is part of a liquidated advance and can\'t be voided.', true);
  openModal(`<h3>Void this record?</h3><p class="mut">It stays visible, struck through, with your reason and name. Its quantities and amounts stop counting.</p>
   <label>Reason<input id="m-r" placeholder="e.g. Entered twice"></label><input id="m-n" type="hidden" value="${esc(S.me?.name || S.me?.username || '')}">${mBtns('Void record')}`,
   {save: () => { const r = $('#m-r').value.trim(), n = $('#m-n').value.trim(); if (!r || !n) return toast('Reason and name are required.', true);
     guard(async () => { await upd(coll + '/' + id, {status: 'void', voidReason: r, voidByName: n}); closeModal(); }, 'Voided'); }});
};

ACT.startCount = () => {
  const b = D.ui.stockBook, {st} = stockFor(b);
  D.count = {book: b, date: today(), by: '', witness: '', blind: true, q: '', lines: activeItems().map(i => ({itemId: i.id, system: r2(st[i.id] || 0), actual: ''}))};
  if (!D.count.lines.length) { D.count = null; return toast('Add items in Setup first.', true); }
  render(); window.scrollTo(0, 0);
};
ACT.cancelCount = () => { D.count = null; render(); };
ACT.postCount = () => {
  const c = D.count, lines = c.lines.filter(l => l.actual !== '' && l.actual != null);
  if (!lines.length) return toast('Enter at least one counted quantity.', true);
  if (!c.by.trim()) return toast('Enter who counted.', true);
  const {st} = stockFor(c.book);  // recompute in case transactions came in meanwhile
  const L = lines.map(l => ({itemId: l.itemId, system: r2(st[l.itemId] || 0), actual: num(l.actual), cost: costOf(l.itemId)}));
  const vv = L.map(l => (l.actual - l.system) * l.cost), loss = r2(sum(vv.filter(v => v < 0), v => v)), gain = r2(sum(vv.filter(v => v > 0), v => v));
  guard(async () => {
    const id = await addDoc('counts', {date: c.date, book: c.book, by: c.by.trim(), witness: c.witness.trim(), lines: L, varianceValue: r2(loss + gain), lossValue: loss, gainValue: gain, status: 'ok'});
    D.count = null; setTimeout(() => ACT.viewCount(id, {date: c.date, book: c.book, by: c.by, lines: L, lossValue: loss, gainValue: gain, varianceValue: r2(loss + gain)}), 100);
  }, 'Count posted');
};
ACT.viewCount = (id, fallback) => {
  const c = S.counts.find(x => x.id === id) || fallback; if (!c) return;
  const v = (c.lines || []).map(l => ({...l, d: l.actual - l.system, val: (l.actual - l.system) * l.cost})).filter(l => Math.abs(l.d) > 0.001).sort((a, b) => a.val - b.val);
  openModal(`<h3>Count result · ${BOOK[c.book].name} · ${fmtD(c.date)}</h3><p class="mut">Counted by ${esc(c.by)}${c.witness ? ', witness ' + esc(c.witness) : ''} · ${(c.lines || []).length} items</p>
   <div class="kpis"><div class="kpi bad"><span>Missing</span><b>${peso(c.lossValue)}</b></div><div class="kpi"><span>Excess</span><b>${peso(c.gainValue)}</b></div><div class="kpi"><span>Net</span><b>${peso(c.varianceValue)}</b></div></div>
   ${v.length ? `<div class="tw"><table><thead><tr><th>Item</th><th class="n">Expected</th><th class="n">Actual</th><th class="n">Difference</th><th class="n">Value</th></tr></thead><tbody>${v.map(l => `<tr><td>${esc(iname(l.itemId))}</td><td class="n">${fq(l.system)}</td><td class="n">${fq(l.actual)}</td><td class="n ${l.d < 0 ? 'bad-t' : 'ok-t'}">${l.d > 0 ? '+' : ''}${fq(l.d)} ${esc(iunit(l.itemId))}</td><td class="n">${peso(l.val)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="alert ok"><span class="ic">✓</span><div>Everything matched.</div></div>'}
   <p class="small mut">Missing stock means it left the storeroom without an issue or waste record. Ask who had access, check for unrecorded issues, and recount big differences.</p>
   <div class="row end"><button data-mact="close">Close</button></div>`);
};

ACT.saveEv = () => {
  const d = D.event; if (!d.name.trim() || !d.date) return toast('Enter the event name and date.', true);
  guard(async () => { const id = await addDoc('events', {name: d.name.trim(), client: d.client.trim(), date: d.date, pax: num(d.pax) || '', contract: r2(num(d.contract)), venue: d.venue.trim(), notes: d.notes.trim(), status: 'planned', plan: []}); D.event = newEvent(); D.ui.eventId = id; D.plan = null; }, 'Event created — now plan the menu quantities');
};
ACT.openEvent = id => { D.ui.eventId = id; D.plan = null; if (D.ui.tab !== 'events') location.hash = 'events'; else render(); window.scrollTo(0, 0); };
ACT.closeEvent = () => { D.ui.eventId = ''; D.plan = null; render(); };
ACT.evStatus = st => guard(async () => { await upd('events/' + D.ui.eventId, {status: st}); }, 'Event ' + st);
ACT.savePlan = () => {
  const lines = D.plan.lines.filter(l => l.itemId && num(l.qty) > 0).map(l => ({itemId: l.itemId, qty: num(l.qty)}));
  guard(async () => { await upd('events/' + D.plan.eventId, {plan: lines}); }, 'Menu plan saved');
};
ACT.editEv = () => {
  const e = S.events[D.ui.eventId]; if (!e) return;
  openModal(`<h3>Edit event</h3><div class="grid"><label>Name<input id="m-name" value="${esc(e.name)}"></label><label>Client<input id="m-client" value="${esc(e.client)}"></label><label>Date<input id="m-date" type="date" value="${esc(e.date)}"></label><label>Pax<input id="m-pax" type="number" value="${esc(e.pax)}"></label><label>Contract ₱<input id="m-ct" type="number" step="any" value="${esc(e.contract)}"></label><label>Venue<input id="m-venue" value="${esc(e.venue)}"></label></div><label>Menu / notes<textarea id="m-notes">${esc(e.notes)}</textarea></label>${mBtns()}`,
   {save: () => guard(async () => { await upd('events/' + e.id, {name: $('#m-name').value.trim() || e.name, client: $('#m-client').value.trim(), date: $('#m-date').value || e.date, pax: num($('#m-pax').value) || '', contract: r2(num($('#m-ct').value)), venue: $('#m-venue').value.trim(), notes: $('#m-notes').value}); closeModal(); }, 'Event updated')});
};
ACT.issueEvent = () => {
  const e = S.events[D.ui.eventId]; const s = eventStats(e); const {st} = stockFor('C');
  const lines = Object.entries(s.items).map(([id, x]) => ({itemId: id, qty: r2(x.bought - (x.issued - x.returned))})).filter(l => l.qty > 0.001 && S.items[l.itemId]);
  if (!lines.length) return toast('Nothing received for this event is waiting to be issued.', true);
  openModal(`<h3>Issue event purchases</h3><p class="mut">Issues everything received for “${esc(e.name)}” that hasn't been issued yet, from the catering storeroom to the event.</p>
   <table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">On hand</th></tr></thead><tbody>${lines.map(l => `<tr><td>${esc(iname(l.itemId))}</td><td class="n">${fq(l.qty)} ${esc(iunit(l.itemId))}</td><td class="n mut">${fq(st[l.itemId] || 0)}</td></tr>`).join('')}</tbody></table>
   <div class="grid" style="margin-top:10px"><label>Released by<input id="m-by" list="dl-staff"></label><label>Received by (event head)<input id="m-rb" list="dl-staff"></label></div>${mBtns('Issue to event')}`,
   {save: () => { const by = $('#m-by').value.trim(), rb = $('#m-rb').value.trim(); if (!by || !rb) return toast('Enter both names.', true);
     guard(async () => { await addDoc('moves', {date: e.date <= today() ? e.date : today(), book: 'C', type: 'issue', toBook: '', eventId: e.id, by, receivedBy: rb, reason: '', note: 'Issued from event purchases', lines: lines.map(l => ({...l, cost: costOf(l.itemId)})), status: 'ok'}); closeModal(); }, 'Issued to event'); }});
};
ACT.marketList = () => {
  const e = S.events[D.ui.eventId], {st} = stockFor('C');
  const L = (D.plan?.lines || []).filter(l => l.itemId && num(l.qty) > 0).map(l => ({...l, need: Math.max(0, num(l.qty) - Math.max(0, st[l.itemId] || 0))})).filter(l => l.need > 0.001);
  const txt = `MARKET LIST — ${e.name} (${fmtD(e.date)}, ${e.pax || '?'} pax)\n` + L.map(l => `• ${iname(l.itemId)} — ${fq(l.need)} ${iunit(l.itemId)}${costOf(l.itemId) ? ` (≈ ${peso(l.need * costOf(l.itemId))})` : ''}`).join('\n') + `\n\nEstimated total: ${peso(sum(L, l => l.need * costOf(l.itemId)))}`;
  showText('Market list', L.length ? txt : 'Everything in the plan is already in the catering storeroom (or the plan is empty / unsaved).');
};
function showText(title, txt) {
  openModal(`<h3>${esc(title)}</h3><textarea id="m-txt" style="min-height:260px;font-family:ui-monospace,monospace;font-size:12.5px" readonly>${esc(txt)}</textarea><div class="row end" style="margin-top:10px"><button data-mact="close">Close</button><button class="pri" data-mact="copy">Copy</button></div>`,
   {copy: async () => { try { await navigator.clipboard.writeText(txt); toast('Copied'); } catch (e) { const t = $('#m-txt'); t.select(); toast('Press Ctrl/Cmd+C to copy'); } }});
}
ACT.csv = kind => {
  const {rFrom: f, rTo: t} = D.ui, q = v => `"${String(v ?? '').replace(/"/g, '""')}"`, rows = [];
  if (kind === 'purchases') { rows.push(['Date','Book','Event','Supplier','Buyer','Receipt','Item','Unit','Qty bought','Qty received','Unit cost','Amount','Status','Received by'].map(q).join(','));
    S.purchases.filter(p => p.date >= f && p.date <= t).forEach(p => p.lines.forEach((l, i) => rows.push([p.date, BOOK[p.book].name, evName(p.eventId), p.supplier, p.buyer, p.receiptNo, iname(l.itemId), iunit(l.itemId), l.qty, p.status === 'received' ? recvQty(p, i) : '', l.cost, r2(l.qty * l.cost), p.status, p.recv?.by || ''].map(q).join(',')))); }
  if (kind === 'expenses') { rows.push(['Date','Book','Event','Category','Description','Paid by','Receipt','Amount','Status'].map(q).join(','));
    S.expenses.filter(e => e.date >= f && e.date <= t).forEach(e => rows.push([e.date, BOOK[e.book].name, evName(e.eventId), e.cat, e.desc, e.paidBy, e.receiptNo, e.amount, e.status].map(q).join(','))); }
  if (kind === 'moves') { rows.push(['Date','Book','Type','Event','Reason','Released by','Received by','Item','Unit','Qty','Unit cost','Value','Status'].map(q).join(','));
    S.moves.filter(m => m.date >= f && m.date <= t).forEach(m => (m.lines || []).forEach(l => rows.push([m.date, BOOK[m.book].name, MT[m.type]?.short + (m.type === 'transfer' ? ' to ' + BOOK[m.toBook]?.name : ''), evName(m.eventId), m.reason, m.by, m.receivedBy, iname(l.itemId), iunit(l.itemId), l.qty, l.cost, r2(l.qty * l.cost), m.status].map(q).join(',')))); }
  downloadFile(`Romualdos ${kind} ${f} to ${t}.csv`, '\ufeff' + rows.join('\r\n'), 'text/csv;charset=utf-8'); toast('CSV downloaded — opens in Excel / Google Sheets');
};
ACT.saveSale = () => {
  const d = D.sale; if (!d.date || d.amount === '') return toast('Enter date and amount.', true);
  guard(async () => { await setDoc('sales/' + d.date, {date: d.date, R: r2(num(d.amount))}); D.sale = {date: today(), amount: ''}; }, 'Sales saved');
};

function itemModal(it, onSaved) {
  openModal(`<h3>${it ? 'Edit item' : 'Add item'}</h3>
   <div class="grid"><label>Name<input id="m-name" value="${esc(it?.name || '')}" placeholder="e.g. Pork liempo"></label>
    <label>Category<select id="m-cat">${ITEM_CATS.map(c => opt(c, c)).join('')}</select></label>
    <label>Unit<input id="m-unit" list="dl-units" value="${esc(it?.unit || 'kg')}"></label>
    <label>Last cost per unit ₱<input id="m-cost" type="number" step="any" min="0" value="${esc(it?.lastCost ?? '')}"></label>
    <label>Par · Restaurant<input id="m-pr" type="number" step="any" min="0" value="${esc(it?.par?.R ?? '')}"></label>
    <label>Par · Catering<input id="m-pc" type="number" step="any" min="0" value="${esc(it?.par?.C ?? '')}"></label>
    ${it ? `<label>Status<select id="m-act"><option value="1">Active</option><option value="0">Hidden (no longer bought)</option></select></label>` : ''}</div>
   ${mBtns()}`,
   {save: () => {
     const name = titleCase($('#m-name').value), unit = $('#m-unit').value.trim();
     if (!name || !unit) return toast('Name and unit are required.', true);
     if (Object.values(S.items).some(x => x.id !== it?.id && x.name.trim().toLowerCase() === name.toLowerCase())) return toast('An item with that name already exists.', true);
     const data = {name, cat: $('#m-cat').value, unit, lastCost: num($('#m-cost').value), par: {R: num($('#m-pr').value), C: num($('#m-pc').value)}, active: it ? $('#m-act').value === '1' : true};
     guard(async () => { let id = it?.id; if (it) await upd('items/' + id, data); else id = await addDoc('items', data); S.items[id] = {id, ...data}; closeModal(); onSaved?.(id); }, it ? 'Item updated' : 'Item added');
   }},
   box => { box.querySelector('#m-cat').value = it ? catOf(it) : (D.ui.newItemCat || 'Vegetables'); if (it) box.querySelector('#m-act').value = it.active === false ? '0' : '1'; });
}
ACT.newItem = () => itemModal(null);
ACT.editItem = id => itemModal(S.items[id]);
function reqWith(book) {
  if (!D.req || (D.req.book !== book && D.req.lines.every(l => !l.itemId))) D.req = newReq({book});
  if (D.req.book !== book) { toast('Your open request is for the ' + BOOK[D.req.book].name + '. Send or clear it first.', true); return null; }
  D.req.lines = D.req.lines.filter(l => l.itemId);
  return D.req;
}
ACT.reqItem = id => {
  const b = D.ui.stockBook, r = reqWith(b); if (!r) return;
  const it = S.items[id], par = num(it.par?.[b]), oh = stockFor(b).st[id] || 0;
  if (r.lines.some(l => l.itemId === id)) { r.lines = r.lines.filter(l => l.itemId !== id); if (!r.lines.length) r.lines = [{itemId: '', qty: '', cost: ''}]; toast(it.name + ' removed from your request'); render(); return; }
  r.lines.push({itemId: id, qty: par > oh ? String(r2(par - Math.max(0, oh))) : '', cost: it.lastCost ? String(it.lastCost) : ''});
  toast(it.name + ' added to your request — open Requisitions to send it'); render();
};
ACT.restockReq = () => {
  const b = D.ui.stockBook, low = belowPar(b), r = reqWith(b); if (!r) return;
  low.forEach(x => { if (!r.lines.some(l => l.itemId === x.item.id)) r.lines.push({itemId: x.item.id, qty: String(x.need), cost: x.item.lastCost ? String(x.item.lastCost) : ''}); });
  if (!r.purpose) r.purpose = 'Restock items below par';
  toast(low.length + ' item' + (low.length === 1 ? '' : 's') + ' added. Check quantities, then send.'); location.hash = 'prs';
};
const normName = n => String(n || '').trim().toLowerCase().replace(/\s*\(.*?\)\s*/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
function commonMissing() {
  const have = new Set(Object.values(S.items).map(i => normName(i.name)));
  if (have.has('kalamansi')) have.add('calamansi');
  return COMMON_ITEMS.filter(([n]) => !have.has(normName(n)));
}
ACT.addCommonItems = () => {
  const miss = commonMissing();
  if (!miss.length) return toast('All common items are already in your list.');
  openModal(`<h3>Add common items</h3>
   <p class="small mut" style="margin-top:0">Tick the items you buy. They're added with a cost of ₱0 and no par level; set those later with <b>✎ Edit</b> or by recording a purchase.</p>
   <div class="row" style="margin-bottom:8px"><button class="sm" type="button" id="ci-all">Select all</button><button class="sm" type="button" id="ci-none">Clear</button></div>
   <div style="max-height:50vh;overflow:auto">${ITEM_CATS.map(cat => { const its = miss.filter(m => m[1] === cat); return its.length ? `<div class="small" style="font-weight:700;margin:10px 0 4px">${esc(cat)}</div>${its.map(([n, c, u]) => `<label class="row" style="flex-direction:row;gap:8px;font-weight:400;margin:2px 0"><input type="checkbox" class="ci" value="${esc(n)}" checked> ${esc(n)} <span class="small mut">(${esc(u)})</span></label>`).join('')}` : ''; }).join('')}</div>
   ${mBtns()}`,
   {save: () => {
     const picked = [...document.querySelectorAll('.ci:checked')].map(x => x.value);
     const list = miss.filter(([n]) => picked.includes(n));
     if (!list.length) return toast('Tick at least one item.', true);
     guard(async () => {
       for (let k = 0; k < list.length; k += 40) {
         const ops = list.slice(k, k + 40).map(([name, cat, unit]) => ({op: 'add', path: 'items/' + genId(), data: {name: titleCase(name), cat, unit, lastCost: 0, par: {R: 0, C: 0}, active: true}}));
         await opsWrite(ops);
       }
       closeModal();
     }, list.length + ' item' + (list.length === 1 ? '' : 's') + ' added');
   }},
   box => { box.querySelector('#ci-all').onclick = () => box.querySelectorAll('.ci').forEach(x => x.checked = true); box.querySelector('#ci-none').onclick = () => box.querySelectorAll('.ci').forEach(x => x.checked = false); });
};
ACT.saveCfg = () => {
  const lines = s => [...new Set(String(s || '').split('\n').map(x => x.trim()).filter(Boolean))];
  const data = {company: D.cfg.company.trim(), address: D.cfg.address.trim(), departments: lines(D.cfg.departments), staff: lines(D.cfg.staff), suppliers: lines(D.cfg.suppliers), expCats: lines(D.cfg.expCats), priceAlertPct: num(D.cfg.pct) || 10};
  guard(async () => { await setDoc('config/main', {...S.config, ...data}); D.cfg = null; }, 'Lists saved');
};

/* ============ events wiring ============ */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !b.closest('#view') && !b.closest('#mbox')) return;
  e.preventDefault(); ACT[b.dataset.act]?.(b.dataset.arg, b);
});
document.addEventListener('input', e => {
  const it = e.target.dataset?.item;
  if (it && e.target.closest('#view')) { const el = e.target, pos = el.selectionStart, v = capWords(el.value); if (v !== el.value) { el.value = v; try { el.setSelectionRange(pos, pos); } catch (x) {} } return; }
  const p = e.target.dataset?.b; if (!p || !e.target.closest('#view')) return; if (e.target.type === 'checkbox') return; setPath(D, p, e.target.value); live(); if (p.startsWith('sheet.')) sheetTouched(); });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset?.item && el.closest('#view')) {
    const [k, i] = el.dataset.item.split('|'), l = D[k].lines[+i], name = titleCase(el.value), ex = findItem(name);
    if (ex) { l.itemId = ex.id; l.newName = ''; if ('cost' in l && !l.cost && ex.lastCost) l.cost = String(ex.lastCost); }
    else { l.itemId = ''; l.newName = name; l.newUnit = l.newUnit || (/(egg|itlog)/i.test(name) ? 'pc' : 'kg'); }
    render(); return;
  }
  const p = el.dataset?.b; if (!p || !el.closest('#view')) return;
  if (el.type === 'checkbox') setPath(D, p, el.checked); else setPath(D, p, el.value);
  if (el.value === '__new') { setPath(D, p, ''); render(); return itemModal(null, id => { setPath(D, p, id); const m = p.match(/^(purchase|req)\.lines\.(\d+)\.itemId$/); if (m && S.items[id]?.lastCost && !D[m[1]].lines[m[2]].cost) D[m[1]].lines[m[2]].cost = String(S.items[id].lastCost); render(); }); }
  const m = p.match(/^(purchase|req)\.lines\.(\d+)\.itemId$/); if (m) { const l = D[m[1]].lines[m[2]]; if (!l.cost && S.items[l.itemId]?.lastCost) l.cost = String(S.items[l.itemId].lastCost); }
  if (p.startsWith('sheet.')) sheetTouched();
  if ('rr' in el.dataset) render();
});
function route() { let h = location.hash.slice(1); if (h === 'expenses') { h = 'purchases'; history.replaceState(null, '', '#purchases'); } D.ui.tab = TABS.some(t => t[0] === h) ? h : 'dash'; render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', route);

/* ============ backend (Google Apps Script — same logins as the inquiry dashboard) ============ */
const API_URL = (window.ROMUALDOS_CONFIG && window.ROMUALDOS_CONFIG.API_URL) || '';
const CACHE = new Map();
let VER = 0, AFTER = 0;
async function api(action, payload = {}) {
  if (!API_URL || API_URL.includes('PASTE_')) throw new Error('The app is not connected yet (config.js has no API URL).');
  let res;
  try { res = await fetch(API_URL, {method: 'POST', body: JSON.stringify({action, token: S.token, ...payload})}); }
  catch (e) { throw new Error('No internet connection'); }
  let data; try { data = await res.json(); } catch (e) { throw new Error('The server did not answer properly. Has the new Apps Script version been deployed?'); }
  if (data.auth && action !== 'login') { endSession(data.error); const er = new Error(data.error); er.auth = true; throw er; }
  if (!data.ok) throw new Error(data.error || 'Server error');
  return data;
}
function applyDocs(docs, fromSync) {
  (docs || []).forEach(d => { CACHE.set(d.path, d); if (fromSync && d.updatedAt > AFTER) AFTER = d.updatedAt; });
  rebuild();
}
function rebuild() {
  const by = {config: [], items: [], events: [], advances: [], purchases: [], expenses: [], moves: [], counts: [], sales: [], prs: [], recipes: []};
  for (const [path, d] of CACHE) { const i = path.indexOf('/'); const c = path.slice(0, i); (by[c] ||= []).push({id: path.slice(i + 1), ...d.data}); }
  const desc = a => a.sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
  const m = by.config.find(d => d.id === 'main');
  S.config = {...DEFAULT_CONFIG, ...(m || {})};
  S.items = Object.fromEntries(by.items.map(d => [d.id, {...d, name: titleCase(d.name)}]));
  S.events = Object.fromEntries(by.events.map(d => [d.id, d]));
  S.advances = desc(by.advances); S.purchases = desc(by.purchases); S.expenses = desc(by.expenses);
  S.moves = desc(by.moves); S.counts = desc(by.counts); S.prs = desc(by.prs);
  S.recipes = by.recipes.filter(r => r.status !== 'void').sort((a, b) => String(a.name).localeCompare(b.name));
  S.sales = Object.fromEntries(by.sales.map(d => [d.date, d]));
  schedule();
}
async function sync(full) {
  if (!S.token || S.syncing) return; S.syncing = true; if (!S.lastSync) schedule();
  try {
    const r = await api('opsSync', {ver: full ? 0 : VER, after: full ? 0 : Math.max(0, AFTER - 15000)});
    const wasAdmin = S.isAdmin;
    S.me = r.me; S.isAdmin = r.me.role === 'Admin';
    if (!r.unchanged) { if (r.users) S.users = r.users; applyDocs(r.docs, true); }
    VER = r.ver; S.lastSync = Date.now(); S.syncErr = '';
    if (wasAdmin !== S.isAdmin) schedule();
  } catch (e) { if (!e.auth) S.syncErr = e.message; }
  finally { S.syncing = false; schedule(); }
}
const TOKEN_KEY = 'rcs_ops_token';
function saveToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} try { t ? sessionStorage.setItem('rcs_token', t) : sessionStorage.removeItem('rcs_token'); } catch (e) {} }
function readToken() { try { return sessionStorage.getItem('rcs_token') || localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
function endSession(msg) { S.token = ''; S.me = null; S.isAdmin = false; S.lastSync = 0; S.loginMsg = msg || ''; CACHE.clear(); VER = 0; AFTER = 0; saveToken(''); closeModal(); rebuild(); render(); }
function loginView() {
  return `<div class="card login"><h2>Staff login</h2>
   <p class="lede" style="text-align:center">Use the same username and password as the inquiry dashboard.</p>
   ${S.loginMsg ? `<div class="alert warn">${esc(S.loginMsg)}</div>` : ''}
   <form id="loginForm"><label>Username<input id="lg-u" autocomplete="username" autocapitalize="none" required></label>
   <label style="margin-top:10px">Password<input id="lg-p" type="password" autocomplete="current-password" required></label>
   <button class="pri" style="width:100%;margin-top:14px" ${S.loggingIn ? 'disabled' : ''}>${S.loggingIn ? 'Checking…' : 'Log in'}</button></form>
   <p class="small mut" style="text-align:center;margin-top:14px">Forgot your password or need an account? Ask the owner. Accounts are managed in the staff logins file.</p></div>`;
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'loginForm') return; e.preventDefault();
  const u = $('#lg-u').value.trim(), pw = $('#lg-p').value;
  S.loggingIn = true; S.loginMsg = ''; render(); $('#lg-u').value = u;
  try { const r = await api('login', {username: u, password: pw}); S.token = r.token; S.me = r.user; S.isAdmin = r.user.role === 'Admin'; saveToken(r.token); S.loggingIn = false; route(); sync(true); }
  catch (er) { S.loggingIn = false; S.loginMsg = er.message; render(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act2]'); if (!b) return;
  if (b.dataset.act2 === 'logout') { api('logout').catch(() => {}); endSession('You have logged out.'); }
  if (b.dataset.act2 === 'refresh') { toast('Refreshing…'); sync(true); }
});
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });

/* ============ boot ============ */
function init() {
  S.token = readToken();
  if (S.token) { S.me = null; sync(true).then(() => route()); }
  route();
}
init();
</script>
