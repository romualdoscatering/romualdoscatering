<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Romualdo's Operations — Purchasing, Stock & Requisitions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1f1d1a;--mut:#6b655c;--line:#e6e0d6;--acc:#8a3b12;--r:#0f766e;--rbg:#e3f4f1;--c:#a0410f;--cbg:#fdecdf;--bad:#b42318;--badbg:#fdecea;--warn:#8a5300;--warnbg:#fff3d9;--ok:#1d7a3a;--okbg:#e6f4ea;--info:#3756a6;--infobg:#e9eefb;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#1f1d1a;color:#fff}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px 4px;max-width:1150px;margin:auto}
.brand{font-family:Fraunces,Georgia,serif;font-size:19px;line-height:1.1}
.brand small{display:block;font:600 10.5px Inter,sans-serif;color:#c9bfae;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.conn{margin-left:auto;font-size:12px;color:#c9bfae}
.conn i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#888;margin-right:6px}
.conn.live i{background:#4ade80}
.conn.err i{background:#f87171}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#e9e2d6;margin-left:10px}.who b{font-weight:600}.who button{background:transparent;color:#e9e2d6;border-color:#5a544b;padding:4px 10px;font-size:12px}
.login{max-width:380px;margin:60px auto}.login h2{text-align:center}
.pr-from{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--infobg);margin-bottom:12px}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 10px;max-width:1150px;margin:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:#d8cfc0;text-decoration:none;padding:9px 11px;white-space:nowrap;border-bottom:3px solid transparent;font-weight:500;font-size:13.5px}
nav a.on{color:#fff;border-color:#e8a25c}
main{max-width:1150px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-family:Fraunces,Georgia,serif;font-size:23px;margin:4px 0 4px;font-weight:600}
.lede{color:var(--mut);margin:0 0 14px;max-width:760px}
h3{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 12px;margin-bottom:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mut)}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);padding:8px 10px;border:1px solid #d9d2c6;border-radius:8px;background:#fff;min-width:0;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid #e8a25c40;border-color:#d98b3f}
input[type=checkbox]{width:auto}
button{font:inherit;font-weight:600;font-size:13.5px;border-radius:8px;padding:8px 14px;border:1px solid #d9d2c6;background:#fff;color:var(--ink);cursor:pointer}
button:hover{border-color:#b9ae9c}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover{background:#73300e}
button.sm{padding:4px 9px;font-size:12px}
button.ghost{border-color:transparent;background:transparent;color:var(--mut)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff;gap:2px;flex-wrap:wrap}
.seg button{border:0;border-radius:999px;padding:6px 14px;background:transparent;color:var(--mut)}
.seg button.on{background:var(--ink);color:#fff}
.seg button.on.r{background:var(--r)}
.seg button.on.c{background:var(--c)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.chip.r{background:var(--rbg);color:var(--r)}.chip.c{background:var(--cbg);color:var(--c)}
.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.info{background:var(--infobg);color:var(--info)}.chip.mut{background:#eee;color:#666}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.void td{text-decoration:line-through;color:#a39d94}
tr.void td:last-child{text-decoration:none}
tr.click{cursor:pointer}
tr.click:hover td{background:#faf7f2}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.lines td{padding:5px 4px;border-bottom:1px dashed var(--line)}
.lines input,.lines select{padding:7px 8px}
.lines input[type=number]{min-width:78px}
.lines select{min-width:170px}
.acts{white-space:nowrap}.acts .sm+.sm{margin-left:4px}
.wf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wf{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid rgba(0,0,0,.1);border-radius:12px;text-decoration:none;color:inherit;background:#fff;position:relative}
.wf:hover{border-color:currentColor}
.wf .wf-n{width:24px;height:24px;border-radius:50%;background:#2f6f6a;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.wf .wf-t{font-weight:700}.wf .wf-h{font-size:12px;opacity:.7}
.wf .wf-b{margin-top:6px;font-size:11.5px;font-weight:700;background:#f4f2ee;border-radius:999px;padding:2px 8px;align-self:flex-start}
.wf.due{border-color:#c77d2c;box-shadow:0 0 0 1px #c77d2c inset}.wf.due .wf-b{background:#fbe7cf;color:#8a4b10}
.stock-t tr.cat-h th{background:var(--bg,#f4f2ee);text-align:left;padding:10px 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border-top:2px solid rgba(0,0,0,.08)}
.stock-t tr.cat-h th span:first-child{margin-right:10px;font-weight:800}
.stock-t tr.cat-h th span.small{text-transform:none;letter-spacing:0;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.kpi{background:#fbf9f6;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi span{font-size:12px;color:var(--mut);font-weight:500}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;margin-bottom:7px;font-size:13.5px}
.alert.bad{background:var(--badbg)}.alert.warn{background:var(--warnbg)}.alert.info{background:var(--infobg)}.alert.ok{background:var(--okbg)}
.alert .ic{font-weight:700;width:18px;text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.end{justify-content:flex-end}
.spacer{flex:1}
.mut{color:var(--mut)}.small{font-size:12px}.bad-t{color:var(--bad);font-weight:600}.ok-t{color:var(--ok);font-weight:600}.warn-t{color:var(--warn);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:14px;background:var(--warnbg);color:var(--warn);font-weight:500}
.steps{margin:0;padding-left:20px}.steps li{margin-bottom:6px}
#modal{position:fixed;inset:0;background:#1f1d1a80;display:none;align-items:flex-start;justify-content:center;padding:40px 10px;z-index:20;overflow:auto}
#modal.open{display:flex}
#modal .box{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:18px;box-shadow:0 20px 50px #0003}
#modal h3{font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:600}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f1d1a;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:30;max-width:90vw;box-shadow:0 8px 24px #0004}
#toast.err{background:var(--bad)}
.empty{padding:18px;text-align:center;color:var(--mut)}
.tabs-mini{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
details summary{cursor:pointer;font-weight:600}
@media (max-width:640px){.conn span{display:none}.who span{display:none}.who{margin-left:6px}main{padding:10px}.card{padding:12px}h2{font-size:20px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">Romualdo's<small>Operations · Requisitions · Stock</small></div>
    <div class="conn" id="conn"><i></i><span>Connecting…</span></div><div class="who" id="who"></div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="view"></main>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

<script src="../config.js"></script>
<script>
/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = n => Math.round(n * 100) / 100;
const peso = n => (n < 0 ? '−' : '') + '₱' + Math.abs(Number(n) || 0).toLocaleString('en-PH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fq = n => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-PH', {maximumFractionDigits: 2});
const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return dstr(d); };
const daysAhead = n => daysAgo(-n);
const monthStart = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-01'; };
const fmtD = s => { if (!s) return ''; const d = new Date(s + 'T00:00'); const o = {month: 'short', day: 'numeric'}; if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric'; return d.toLocaleDateString('en-PH', o); };
const fmtT = t => t ? new Date(t).toLocaleString('en-PH', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}) : '';
const sum = (arr, f) => arr.reduce((a, x) => a + (f(x) || 0), 0);

const BOOK = {R: {name: 'Restaurant', cls: 'r'}, C: {name: 'Catering', cls: 'c'}};
const ITEM_CATS = ['Poultry','Pork','Beef','Fish/Seafood','Vegetables','Eggs/Dairy','Pantry Essentials','Others'];
/* Older category names (from the first version) are shown under the new headers. */
const OLD_CATS = {'Chicken & poultry':'Poultry','Seafood':'Fish/Seafood','Fruits':'Vegetables','Dairy & eggs':'Eggs/Dairy','Rice & grains':'Pantry Essentials','Dry goods / grocery':'Pantry Essentials','Condiments & spices':'Pantry Essentials','Oil & fats':'Pantry Essentials','Beverages':'Others','Bread & bakery':'Others'};
/* Item names are shown with every word capitalized: "chicken thigh fillet" -> "Chicken Thigh Fillet". */
const titleCase = n => String(n || '').trim().replace(/\s+/g, ' ').replace(/(^|[\s(\-\/])([a-zà-ÿñ])/g, (m, p, c) => p + c.toUpperCase());
const catOf = i => { const c = (i && i.cat) || 'Others'; return ITEM_CATS.includes(c) ? c : (OLD_CATS[c] || 'Others'); };
const catIdx = i => ITEM_CATS.indexOf(catOf(i));
/* Common items an Admin can add in one click (only the ones not already in the list are added). */
const COMMON_ITEMS = [
  ['Chicken Breast','Poultry','kg'],['Special Cut Thigh','Poultry','kg'],['Chicken Wings','Poultry','kg'],['Chicken Drumstick','Poultry','kg'],['Chicken Leg Quarter','Poultry','kg'],
  ['Pork Belly','Pork','kg'],['Pork Chop','Pork','kg'],['Pork Spare Ribs','Pork','kg'],['Pork Shoulder','Pork','kg'],
  ['Beef Oxtail','Beef','kg'],['Beef Shank (Bulalo)','Beef','kg'],['Ground Beef','Beef','kg'],['Beef Sirloin','Beef','kg'],['Beef Tripe','Beef','kg'],
  ['Tilapia','Fish/Seafood','kg'],['Squid','Fish/Seafood','kg'],['Tuna Belly','Fish/Seafood','kg'],['Cream Dory Fillet','Fish/Seafood','kg'],
  ['Eggplant','Vegetables','kg'],['Kangkong','Vegetables','bundle'],['Ampalaya','Vegetables','kg'],['Bell Pepper','Vegetables','kg'],['Calamansi','Vegetables','kg'],['Lemongrass','Vegetables','bundle'],
  ['Butter','Eggs/Dairy','kg'],['All-Purpose Cream','Eggs/Dairy','pack'],['Cheese','Eggs/Dairy','kg'],['Fresh Milk','Eggs/Dairy','L'],
  ['Soy Sauce','Pantry Essentials','L'],['Vinegar','Pantry Essentials','L'],['Fish Sauce (Patis)','Pantry Essentials','L'],['Oyster Sauce','Pantry Essentials','L'],['Banana Ketchup','Pantry Essentials','kg'],
  ['Cooking Oil','Pantry Essentials','L'],['Brown Sugar','Pantry Essentials','kg'],['Cornstarch','Pantry Essentials','kg'],['All-Purpose Flour','Pantry Essentials','kg'],
  ['Bay Leaves (Laurel)','Pantry Essentials','pack'],['Whole Peppercorns','Pantry Essentials','pack'],['Coconut Milk','Pantry Essentials','L'],['Tomato Sauce','Pantry Essentials','kg']
];
const UNITS = ['kg','g','pc','pack','bundle','tray','sack','L','bottle','can','box','dozen','gallon','head'];
const WASTE_REASONS = ['Spoiled / rotten','Expired','Damaged / dropped','Cooking error','Over-production (cooked, unsold)','Other'];
const DEFAULT_CONFIG = {company: "Romualdo's Catering", address: '', departments: ['Kitchen', 'Catering operations', 'Dining / service', 'Bar', 'Admin / office', 'Maintenance'], staff: [], suppliers: [], expCats: ['Transportation / fare','LPG / fuel','Ice','Packaging / disposables','Cleaning supplies','Utilities','Equipment rental','Repairs & maintenance','Extra labor / helpers','Permits & fees','Miscellaneous'], priceAlertPct: 10};
const MT = {
  issue:   {label: 'Issue (stock used)', short: 'Issue', chip: 'info'},
  return:  {label: 'Return of leftovers from event', short: 'Return', chip: 'ok'},
  waste:   {label: 'Waste / spoilage', short: 'Waste', chip: 'bad'},
  transfer:{label: 'Transfer to the other book', short: 'Transfer', chip: 'mut'}
};

/* ============ state ============ */
const ACT = {};
const S = {state: 'login', prs: [], token: '', me: null, isAdmin: false, users: [], lastSync: 0, syncErr: '', syncing: false, loginMsg: '',
  config: {...DEFAULT_CONFIG}, items: {}, events: {}, advances: [], purchases: [], expenses: [], moves: [], counts: [], sales: {}, names: {}, busy: false};

const newPurchase = (o = {}) => ({date: today(), book: 'R', eventId: '', supplier: '', buyer: '', receiptNo: '', advanceId: '', prId: '', prNo: '', lines: [{itemId: '', qty: '', cost: ''}], ...o});
const newExpense = (o = {}) => ({date: today(), book: 'R', eventId: '', cat: '', desc: '', amount: '', paidBy: '', receiptNo: '', advanceId: '', ...o});
const newAdvance = (o = {}) => ({date: today(), book: 'R', eventId: '', to: '', amount: '', givenBy: '', note: '', ...o});
const newMove = (o = {}) => ({date: today(), book: 'R', type: 'issue', eventId: '', by: '', receivedBy: '', reason: '', note: '', lines: [{itemId: '', qty: ''}], ...o});
const newEvent = () => ({name: '', client: '', date: daysAhead(7), pax: '', contract: '', venue: '', notes: ''});

const D = {
  purchase: newPurchase(), expense: newExpense(), advance: newAdvance(), move: newMove(), event: newEvent(),
  plan: null, count: null, sale: {date: today(), amount: ''},
  ui: {tab: 'dash', pBook: '', pStatus: '', eBook: '', mBook: '', stockBook: 'R', stockQ: '', eventId: '', rFrom: monthStart(), rTo: today(), showAll: {}}
};
const getPath = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
const setPath = (o, p, v) => { const k = p.split('.'); let x = o; for (let i = 0; i < k.length - 1; i++) x = x[k[i]]; x[k[k.length - 1]] = v; };

/* ============ lookups ============ */
const activeItems = () => Object.values(S.items).filter(i => i.active !== false).sort((a, b) => (catIdx(a) - catIdx(b)) || String(a.name).localeCompare(b.name));
const iname = id => S.items[id]?.name || (id ? '(removed item)' : '');
const iunit = id => S.items[id]?.unit || '';
const evName = id => id ? (S.events[id]?.name || '(event)') : '';
const live_ = x => x.status !== 'void';
const chipBook = (b, ev) => `<span class="chip ${BOOK[b]?.cls || 'mut'}">${BOOK[b]?.name || '?'}</span>${ev ? ` <span class="small">${esc(evName(ev))}</span>` : ''}`;
const who = u => { if (!u) return ''; const x = S.users.find(v => v.username === u); return x ? (x.name || x.username) : u; };
const staffList = () => [...new Set([...S.users.filter(u => u.active !== false).map(u => u.name || u.username), ...(S.config.staff || []), ...S.purchases.map(p => p.buyer), ...S.advances.map(a => a.to)].filter(Boolean))].sort();
const supplierList = () => [...new Set([...(S.config.suppliers || []), ...S.purchases.map(p => p.supplier)].filter(Boolean))].sort();
const recvQty = (p, i) => num(p.recv?.qty?.[i] ?? p.lines[i].qty);
const shortValue = p => p.status === 'received' ? p.lines.reduce((a, l, i) => a + Math.max(0, num(l.qty) - recvQty(p, i)) * num(l.cost), 0) : 0;
const pctAlert = () => num(S.config.priceAlertPct) || 10;
function priceJump(l, base) { const prev = num(base); if (!prev || !num(l.cost)) return 0; return (num(l.cost) - prev) / prev * 100; }
function priceFlag(l) {
  const it = S.items[l.itemId]; if (!it) return '';
  const ch = priceJump(l, it.lastCost); const p = pctAlert();
  if (ch > p) return `<span class="chip bad" title="Last price ${peso(it.lastCost)}">▲ ${ch.toFixed(0)}% vs last</span>`;
  if (ch < -p) return `<span class="chip info" title="Last price ${peso(it.lastCost)}">▼ ${Math.abs(ch).toFixed(0)}% vs last</span>`;
  return '';
}

/* ============ stock engine ============
   On hand = last posted physical count (per item, per book) + received purchases − issues + returns − waste ± transfers recorded after it */
function stockFor(book) {
  const st = {}, since = {}, sinceDate = {};
  S.counts.filter(c => c.book === book && live_(c)).sort((a, b) => a.createdAt - b.createdAt)
    .forEach(c => (c.lines || []).forEach(l => { since[l.itemId] = c.createdAt; sinceDate[l.itemId] = c.date; st[l.itemId] = num(l.actual); }));
  const add = (id, t, q) => { if (t > (since[id] ?? -Infinity)) st[id] = (st[id] || 0) + q; };
  S.purchases.forEach(p => { if (p.book === book && p.status === 'received') { const t = p.recv?.at || p.createdAt; p.lines.forEach((l, i) => add(l.itemId, t, recvQty(p, i))); } });
  S.moves.forEach(m => {
    if (!live_(m)) return; let sign = 0;
    if (m.book === book) sign = m.type === 'return' ? 1 : -1;
    else if (m.type === 'transfer' && m.toBook === book) sign = 1;
    if (sign) (m.lines || []).forEach(l => add(l.itemId, m.createdAt, sign * num(l.qty)));
  });
  return {st, sinceDate};
}
function costOf(id) { return num(S.items[id]?.lastCost); }

/* ============ period figures ============ */
function figures(book, from, to) {
  const inR = x => x.date >= from && x.date <= to && live_(x) && (!book || x.book === book);
  const ps = S.purchases.filter(inR), es = S.expenses.filter(inR);
  const f = {bought: sum(ps, p => num(p.total)), pending: sum(ps.filter(p => p.status === 'pending'), p => num(p.total)),
    received: sum(ps.filter(p => p.status === 'received'), p => p.lines.reduce((a, l, i) => a + recvQty(p, i) * num(l.cost), 0)),
    shortRecv: sum(ps, shortValue), expenses: sum(es, e => num(e.amount)), used: 0, waste: 0, shrink: 0, sales: 0, expByCat: {}};
  es.forEach(e => f.expByCat[e.cat || 'Uncategorized'] = (f.expByCat[e.cat || 'Uncategorized'] || 0) + num(e.amount));
  S.moves.filter(inR).forEach(m => { const v = sum(m.lines || [], l => num(l.qty) * num(l.cost));
    if (m.type === 'issue') f.used += v; else if (m.type === 'return') f.used -= v; else if (m.type === 'waste') f.waste += v; });
  S.counts.filter(inR).forEach(c => f.shrink += num(c.varianceValue));
  if (!book || book === 'R') Object.values(S.sales).forEach(s => { if (s.date >= from && s.date <= to) f.sales += num(s.R); });
  return f;
}
function eventStats(ev) {
  const id = ev.id, items = {};
  const g = i => items[i] ||= {planned: 0, bought: 0, pending: 0, issued: 0, returned: 0};
  (ev.plan || []).forEach(l => g(l.itemId).planned += num(l.qty));
  const ps = S.purchases.filter(p => p.eventId === id && live_(p));
  ps.forEach(p => p.lines.forEach((l, i) => { if (p.status === 'received') g(l.itemId).bought += recvQty(p, i); else g(l.itemId).pending += num(l.qty); }));
  const ms = S.moves.filter(m => m.eventId === id && live_(m) && (m.type === 'issue' || m.type === 'return'));
  let used = 0;
  ms.forEach(m => m.lines.forEach(l => { const v = num(l.qty) * num(l.cost); if (m.type === 'issue') { g(l.itemId).issued += num(l.qty); used += v; } else { g(l.itemId).returned += num(l.qty); used -= v; } }));
  const es = S.expenses.filter(e => e.eventId === id && live_(e));
  const exp = sum(es, e => num(e.amount)), purch = sum(ps, p => num(p.total)), cost = used + exp, contract = num(ev.contract);
  return {items, ps, ms, es, purch, used, exp, cost, contract, margin: contract - cost, pct: contract ? (contract - cost) / contract * 100 : null, perPax: num(ev.pax) ? cost / num(ev.pax) : null};
}
function advanceSpent(id) {
  const ps = S.purchases.filter(p => p.advanceId === id && live_(p)), es = S.expenses.filter(e => e.advanceId === id && live_(e));
  return {ps, es, spent: sum(ps, p => num(p.total)) + sum(es, e => num(e.amount))};
}
const openAdvances = book => S.advances.filter(a => a.status === 'open' && (!book || a.book === book));

/* ============ alerts ============ */
function alerts() {
  const A = [], wk = daysAgo(7), t = today(), pct = pctAlert();
  const waitPR = S.prs.filter(p => p.status === 'submitted');
  if (waitPR.length) A.push([S.isAdmin ? 'warn' : 'info', `${waitPR.length} requisition${waitPR.length > 1 ? 's' : ''} waiting for approval (${peso(sum(waitPR, p => num(p.total)))})${waitPR.some(p => p.priority === 'Urgent') ? ' — includes URGENT' : ''}.`, 'prs']);
  const noPR = S.purchases.filter(p => p.date >= daysAgo(7) && live_(p) && !p.prId);
  if (noPR.length && S.prs.length) A.push(['info', `${noPR.length} purchase${noPR.length > 1 ? 's' : ''} this week were made without a requisition (${peso(sum(noPR, p => num(p.total)))}).`, 'purchases']);
  const pend = S.purchases.filter(p => p.status === 'pending');
  const oldPend = pend.filter(p => p.date < t);
  if (oldPend.length) A.push(['bad', `${oldPend.length} purchase${oldPend.length > 1 ? 's' : ''} from previous days still not received (${peso(sum(oldPend, p => num(p.total)))}). Goods that were paid for but never checked in are the most common leak.`, 'purchases']);
  else if (pend.length) A.push(['warn', `${pend.length} purchase${pend.length > 1 ? 's' : ''} today waiting to be received and weighed.`, 'purchases']);
  const shorts = S.purchases.filter(p => p.date >= daysAgo(30) && shortValue(p) > 0.5);
  if (shorts.length) A.push(['bad', `Short deliveries in the last 30 days: ${shorts.length} purchase${shorts.length > 1 ? 's' : ''}, ${peso(sum(shorts, shortValue))} paid for but not received.`, 'purchases']);
  const self = S.purchases.filter(p => p.date >= wk && p.status === 'received' && p.recv?.by && p.buyer && p.recv.by.trim().toLowerCase() === p.buyer.trim().toLowerCase());
  if (self.length) A.push(['warn', `${self.length} purchase${self.length > 1 ? 's were' : ' was'} received by the same person who bought ${self.length > 1 ? 'them' : 'it'} this week. Receiving should be done by someone else.`, 'purchases']);
  let jumps = 0; S.purchases.filter(p => p.date >= wk && live_(p)).forEach(p => p.lines.forEach(l => { if (priceJump(l, l.prevCost) > pct) jumps++; }));
  if (jumps) A.push(['warn', `${jumps} item price${jumps > 1 ? 's' : ''} this week came in more than ${pct}% above the last price paid. Check with the buyer or compare stalls.`, 'purchases']);
  const noRcpt = S.purchases.filter(p => p.date >= wk && live_(p) && !p.receiptNo);
  if (noRcpt.length) A.push(['info', `${noRcpt.length} purchase${noRcpt.length > 1 ? 's' : ''} this week ${noRcpt.length > 1 ? 'have' : 'has'} no receipt number (${peso(sum(noRcpt, p => num(p.total)))}).`, 'purchases']);
  const oldAdv = S.advances.filter(a => a.status === 'open' && a.date < daysAgo(1));
  if (oldAdv.length) A.push(['warn', `${oldAdv.length} cash advance${oldAdv.length > 1 ? 's' : ''} older than a day not yet liquidated (${peso(sum(oldAdv, a => num(a.amount)))}).`, 'advances']);
  const badLiq = S.advances.filter(a => a.status === 'liquidated' && a.date >= daysAgo(30) && Math.abs(num(a.diff)) >= 1);
  if (badLiq.length) A.push(['bad', `${badLiq.length} liquidation${badLiq.length > 1 ? 's' : ''} in the last 30 days did not balance. Net unaccounted cash: ${peso(sum(badLiq, a => num(a.diff)))}.`, 'advances']);
  ['R', 'C'].forEach(b => {
    const cs = S.counts.filter(c => c.book === b && live_(c)).sort((x, y) => y.createdAt - x.createdAt);
    if (!cs.length) { if (Object.keys(S.items).length) A.push(['info', `No physical count yet for ${BOOK[b].name}. Do a first count to set opening stock.`, 'stock']); return; }
    const last = cs[0];
    if (num(last.lossValue) < -1) A.push(['bad', `${BOOK[b].name} count on ${fmtD(last.date)}: ${peso(Math.abs(last.lossValue))} of stock missing with no record of use or waste.`, 'stock']);
    if (last.date < daysAgo(7)) A.push(['warn', `${BOOK[b].name} has not been counted since ${fmtD(last.date)}. Count at least weekly (meats daily).`, 'stock']);
    const {st} = stockFor(b); const neg = Object.entries(st).filter(([id, q]) => q < -0.001 && S.items[id]);
    if (neg.length) A.push(['warn', `${BOOK[b].name}: ${neg.length} item${neg.length > 1 ? 's show' : ' shows'} negative stock (more issued than received). Purchases may be unrecorded or not yet received.`, 'stock']);
    const low = activeItems().filter(i => num(i.par?.[b]) > 0 && (st[i.id] || 0) < num(i.par[b]));
    if (low.length) A.push(['info', `${BOOK[b].name}: ${low.length} item${low.length > 1 ? 's' : ''} below par level — ${low.slice(0, 5).map(i => esc(i.name)).join(', ')}${low.length > 5 ? '…' : ''}.`, 'stock']);
  });
  const voids = [...S.purchases, ...S.expenses, ...S.moves].filter(x => x.status === 'void' && x.voidAt > Date.now() - 7 * 864e5);
  if (voids.length) A.push(['info', `${voids.length} record${voids.length > 1 ? 's were' : ' was'} voided in the last 7 days. Review the reasons.`, 'reports']);
  Object.values(S.events).filter(e => e.status !== 'closed' && e.date < t).forEach(e => {
    const s = eventStats(e); const unissued = Object.values(s.items).some(x => x.bought > 0) && !s.ms.length;
    if (unissued) A.push(['warn', `Event “${esc(e.name)}” has purchases but nothing was issued to it — its food cost is not recorded yet.`, 'events']);
  });
  return A;
}

  </div>
  <div class="card"><div class="row" style="margin-bottom:8px"><h3>All advances</h3></div>
   ${list.length ? `<div class="tw"><table><thead><tr><th>Date</th><th>Book</th><th>Buyer</th><th class="n">Advance</th><th class="n">Spent (recorded)</th><th class="n">Change returned</th><th class="n">Unaccounted</th><th>Status</th><th></th></tr></thead><tbody>
   ${take('adv', list).map(a => { const s = advanceSpent(a.id); const exp = num(a.amount) - s.spent; return `<tr class="${a.status === 'void' ? 'void' : ''}">
    <td>${fmtD(a.date)}</td><td>${chipBook(a.book, a.eventId)}</td><td>${esc(a.to)}<div class="small mut">released by ${esc(a.givenBy || '—')}</div></td>
    <td class="n">${peso(a.amount)}</td><td class="n">${peso(s.spent)}<div class="small mut">${s.ps.length} purch · ${s.es.length} exp</div></td>
    <td class="n">${a.status === 'liquidated' ? peso(a.change) : `<span class="mut">expect ${peso(exp)}</span>`}</td>
    <td class="n">${a.status === 'liquidated' ? (Math.abs(num(a.diff)) >= 1 ? `<span class="bad-t">${peso(a.diff)}</span>` : '<span class="ok-t">balanced</span>') : ''}</td>
    <td>${a.status === 'open' ? '<span class="chip warn">open</span>' : a.status === 'liquidated' ? '<span class="chip ok">liquidated</span>' : ''}</td>
    <td class="row">${a.status === 'open' ? `<button class="sm pri" data-act="liquidate" data-arg="${a.id}">Liquidate</button>` : a.status === 'liquidated' ? `<button class="sm" data-act="liquidate" data-arg="${a.id}">View</button>` : ''}${a.status === 'open' || a.status === 'void' ? voidBtn('advances', a) : ''}</td></tr>`; }).join('')}
   </tbody></table></div>${showMore('adv', list.length)}` : '<div class="empty">No cash advances yet.</div>'}
  </div>`;
};

/* ============ PURCHASES ============ */
V.purchases = () => {
  const d = D.purchase, f = D.ui;
  const advs = openAdvances(d.book);
  const list = S.purchases.filter(p => (!f.pBook || p.book === f.pBook) && (!f.pStatus || (f.pStatus === 'short' ? shortValue(p) > 0.5 : p.status === f.pStatus)));
  return `<h2>Purchases</h2>
  <p class="lede">The buyer records what was bought, from whom and at what price. Every purchase is charged to <b>Restaurant</b> or to <b>Catering</b> (and to a specific event when it's for one). Nothing enters stock until someone else receives it.</p>
  <div class="card"><div class="row"><h3>New purchase</h3><span class="spacer"></span>${bookSeg('purchase.book')}</div>
   ${d.prId ? `<div class="pr-from">From approved requisition <b>${esc(d.prNo)}</b><span class="spacer"></span><button class="sm" data-act="openPR" data-arg="${d.prId}">View PR</button><button class="sm ghost" data-act="unlinkPR">Unlink</button></div>` : `<p class="small mut" style="margin-top:0">Buying against a requisition? Open it in <a href="#prs">Requisitions</a> and tap <b>Enter the purchase</b>.</p>`}
   <div class="grid">
    <label>Date<input type="date" data-b="purchase.date"></label>
    ${d.book === 'C' ? `<label>For event${sel('purchase.eventId', eventOptions(), false)}</label>` : ''}
    <label>Supplier / stall<input list="dl-sup" data-b="purchase.supplier" placeholder="e.g. Aling Nena, Stall 12"></label>
    <label>Bought by<input list="dl-staff" data-b="purchase.buyer" placeholder="Name"></label>
    <label>Receipt / OR no.<input data-b="purchase.receiptNo" placeholder="Blank if none"></label>
    <label>Paid from${sel('purchase.advanceId', opt('', 'Paid directly (no advance)') + advs.map(a => opt(a.id, `${a.to} · ${peso(a.amount)} · ${fmtD(a.date)}`)).join(''), false)}</label>
   </div>
   ${linesEditor('purchase', {cost: true})}
   <div class="row" style="margin-top:12px"><span>Total&nbsp; <b style="font-size:17px" data-live="total:purchase">${peso(sum(d.lines, l => num(l.qty) * num(l.cost)))}</b></span><span class="spacer"></span><button class="ghost" data-act="resetP">Clear</button><button class="pri" data-act="saveP">Save purchase</button></div>
  </div>
  <div class="card"><div class="row" style="margin-bottom:10px"><h3>Purchase register</h3><span class="spacer"></span>
    ${filterSeg('ui.pBook', [['', 'Both'], ['R', 'Restaurant'], ['C', 'Catering']])}
    ${filterSeg('ui.pStatus', [['', 'All'], ['pending', 'To receive'], ['received', 'Received'], ['short', 'Short'], ['void', 'Void']])}</div>
   ${list.length ? `<div class="tw"><table><thead><tr><th>Date</th><th>Book</th><th>Supplier</th><th>Buyer</th><th>Receipt</th><th class="n">Total</th><th>Status</th><th></th></tr></thead><tbody>
    ${take('pur', list).map(p => { const sv = shortValue(p); const jump = p.lines.some(l => priceJump(l, l.prevCost) > pctAlert());
      return `<tr class="click ${p.status === 'void' ? 'void' : ''}" data-act="viewP" data-arg="${p.id}"><td>${fmtD(p.date)}</td><td>${chipBook(p.book, p.eventId)}</td><td>${esc(p.supplier || '—')}<div class="small mut">${p.lines.length} item${p.lines.length > 1 ? 's' : ''}${jump ? ' · <span class="bad-t">price ▲</span>' : ''}${p.prNo ? ' · ' + esc(p.prNo) : ' · <span class="warn-t">no PR</span>'}</div></td><td>${esc(p.buyer)}</td><td>${p.receiptNo ? esc(p.receiptNo) : '<span class="chip warn">none</span>'}</td><td class="n">${peso(p.total)}</td>
      <td>${p.status === 'pending' ? '<span class="chip warn">to receive</span>' : p.status === 'received' ? (sv > 0.5 ? `<span class="chip bad">short ${peso(sv)}</span>` : '<span class="chip ok">received</span>') + `<div class="small mut">by ${esc(p.recv?.by || '')}</div>` : ''}</td>
      <td class="row">${p.status === 'pending' ? `<button class="sm pri" data-act="receive" data-arg="${p.id}">Receive</button>` : ''}${voidBtn('purchases', p)}</td></tr>`; }).join('')}
   </tbody></table></div>${showMore('pur', list.length)}` : '<div class="empty">No purchases match.</div>'}
  </div>`;
};

/* ============ EXPENSES ============ */
V.expenses = () => {
  const d = D.expense, advs = openAdvances(d.book);

  return `<h2>Expenses</h2>

  <div class="card"><div class="row"><h3>Record an expense</h3><span class="spacer"></span>${bookSeg('expense.book')}</div>
   <div class="grid">
    <label>Date<input type="date" data-b="expense.date"></label>
    ${d.book === 'C' ? `<label>For event${sel('expense.eventId', eventOptions('General catering (no specific event)'), false)}</label>` : ''}
    <label>Category${sel('expense.cat', opt('', '— choose —') + (S.config.expCats || []).map(c => opt(c, c)).join(''), false)}</label>
    <label>Description<input data-b="expense.desc" placeholder="e.g. Tricycle to Farmers market"></label>
    <label>Amount ₱<input type="number" inputmode="decimal" step="any" min="0" data-b="expense.amount"></label>
    <label>Paid by<input list="dl-staff" data-b="expense.paidBy"></label>
    <label>Receipt / OR no.<input data-b="expense.receiptNo" placeholder="Blank if none"></label>
    <label>Paid from${sel('expense.advanceId', opt('', 'Paid directly (no advance)') + advs.map(a => opt(a.id, `${a.to} · ${peso(a.amount)} · ${fmtD(a.date)}`)).join(''), false)}</label>
   </div>
   <div class="row end"><button class="pri" data-act="saveE">Save expense</button></div>
  </div>
  <div class="card"><div class="row" style="margin-bottom:10px"><h3>Expense register</h3><span class="spacer"></span>${filterSeg('ui.eBook', [['', 'Both'], ['R', 'Restaurant'], ['C', 'Catering']])}</div>
   ${list.length ? `<div class="tw"><table><thead><tr><th>Date</th><th>Book</th><th>Category</th><th>Description</th><th>Paid by</th><th>Receipt</th><th class="n">Amount</th><th></th></tr></thead><tbody>
    ${take('exp', list).map(e => `<tr class="${e.status === 'void' ? 'void' : ''}"><td>${fmtD(e.date)}</td><td>${chipBook(e.book, e.eventId)}</td><td>${esc(e.cat)}</td><td>${esc(e.desc)}</td><td>${esc(e.paidBy)}</td><td>${e.receiptNo ? esc(e.receiptNo) : '<span class="chip warn">none</span>'}</td><td class="n">${peso(e.amount)}</td><td>${voidBtn('expenses', e)}</td></tr>`).join('')}
   </tbody></table></div>${showMore('exp', list.length)}` : '<div class="empty">No expenses yet.</div>'}
  </div>`;
};

/* ============ ISSUE & WASTE ============ */
V.usage = () => {
  const d = D.move;
  if (d.book === 'R' && d.type === 'return') d.type = 'issue';
  const list = S.moves.filter(m => !D.ui.mBook || m.book === D.ui.mBook);
  const types = d.book === 'R' ? ['issue', 'waste', 'transfer'] : ['issue', 'return', 'waste', 'transfer'];
  const lbl = {issue: d.book === 'R' ? 'Issue to kitchen' : 'Issue to event', return: 'Return leftovers', waste: 'Waste / spoilage', transfer: `Transfer to ${d.book === 'R' ? 'Catering' : 'Restaurant'}`};
  return `<h2>Issue & waste</h2>
  <p class="lede">This is consumption. Stock leaves the storeroom only through a signed issue: to the restaurant kitchen each day, or to a catering event. Leftovers that come back from an event are returned. Spoilage is written off here with a reason, so it is never confused with missing stock.</p>
  <div class="card"><div class="row"><h3>Record stock out</h3><span class="spacer"></span>${bookSeg('move.book')}</div>
   <div class="row" style="margin-bottom:12px"><div class="seg">${types.map(t => `<button type="button" class="${d.type === t ? 'on' : ''}" data-act="set" data-arg="move.type|${t}">${lbl[t]}</button>`).join('')}</div></div>
   <div class="grid">
    <label>Date<input type="date" data-b="move.date"></label>
    ${d.book === 'C' && (d.type === 'issue' || d.type === 'return') ? `<label>Event${sel('move.eventId', eventOptions('— choose event —'), false)}</label>` : ''}
    ${d.type === 'waste' ? `<label>Reason${sel('move.reason', opt('', '— choose —') + WASTE_REASONS.map(r => opt(r, r)).join(''), false)}</label>` : ''}
    <label>${d.type === 'return' ? 'Returned by' : 'Released by (storekeeper)'}<input list="dl-staff" data-b="move.by"></label>
    <label>${d.type === 'waste' ? 'Witnessed by' : d.type === 'return' ? 'Received back by' : 'Received by (cook / event head)'}<input list="dl-staff" data-b="move.receivedBy"></label>
    <label>Note<input data-b="move.note"></label>
   </div>
   ${linesEditor('move', {stock: true})}
   <div class="row end" style="margin-top:12px"><button class="ghost" data-act="resetM">Clear</button><button class="pri" data-act="saveM">Save</button></div>
  </div>
  <div class="card"><div class="row" style="margin-bottom:10px"><h3>Stock-out register</h3><span class="spacer"></span>${filterSeg('ui.mBook', [['', 'Both'], ['R', 'Restaurant'], ['C', 'Catering']])}</div>
   ${list.length ? `<div class="tw"><table><thead><tr><th>Date</th><th>Book</th><th>Type</th><th>Items</th><th>Released / received</th><th class="n">Value</th><th></th></tr></thead><tbody>
    ${take('mov', list).map(m => `<tr class="${m.status === 'void' ? 'void' : ''}"><td>${fmtD(m.date)}</td><td>${chipBook(m.book, m.eventId)}</td><td><span class="chip ${MT[m.type]?.chip}">${MT[m.type]?.short}${m.type === 'transfer' ? ' → ' + BOOK[m.toBook]?.name : ''}</span>${m.reason ? `<div class="small mut">${esc(m.reason)}</div>` : ''}</td>
     <td class="small">${(m.lines || []).map(l => `${esc(iname(l.itemId))} ${fq(l.qty)}${esc(iunit(l.itemId))}`).join(', ')}</td><td class="small">${esc(m.by)} → ${esc(m.receivedBy)}</td><td class="n">${peso(sum(m.lines || [], l => num(l.qty) * num(l.cost)))}</td><td>${voidBtn('moves', m)}</td></tr>`).join('')}
   </tbody></table></div>${showMore('mov', list.length)}` : '<div class="empty">Nothing recorded yet.</div>'}
  </div>`;
};

/* ============ STOCK & COUNTS ============ */
V.stock = () => {
  const b = D.ui.stockBook, {st, sinceDate} = stockFor(b), q = D.ui.stockQ.trim().toLowerCase();
  const rows = activeItems().filter(i => !q || i.name.toLowerCase().includes(q) || catOf(i).toLowerCase().includes(q));
  const missingCommon = S.isAdmin ? commonMissing().length : 0;
  const low = belowPar(b);
  const inReq = new Set((D.req?.lines || []).map(l => l.itemId).filter(Boolean));
  const totalVal = sum(activeItems(), i => Math.max(0, st[i.id] || 0) * costOf(i.id));
  const counts = S.counts.filter(c => c.book === b);
  if (D.count) return countSheet();
  return `<h2>Stock & counts</h2>
  <p class="lede">Expected stock = last physical count + received purchases − issues − waste ± returns and transfers. A physical count compares this to what is actually on the shelf. The difference is <b>unexplained loss</b>: pilferage, unrecorded use, or wrong entries.</p>
  <div class="card"><div class="row" style="margin-bottom:10px">${filterSeg('ui.stockBook', [['R', 'Restaurant storeroom'], ['C', 'Catering storeroom']])}<span class="spacer"></span>
    <input data-b="ui.stockQ" data-rr placeholder="Search item…" style="max-width:200px">${S.isAdmin ? `<button data-act="newItem">＋ Add item</button>` : ''}<button class="pri" data-act="startCount">Start physical count</button></div>
   ${low.length ? `<div class="alert warn"><span class="ic">⚠</span><div style="flex:1"><b>${low.length} item${low.length === 1 ? ' is' : 's are'} below par</b> in the ${BOOK[b].name.toLowerCase()}: ${low.slice(0, 6).map(x => esc(x.item.name)).join(', ')}${low.length > 6 ? '…' : ''}.</div><button class="sm pri" data-act="restockReq">Request restock</button></div>` : ''}
   ${missingCommon ? `<div class="alert info"><span class="ic">i</span><div>${missingCommon} common item${missingCommon === 1 ? ' is' : 's are'} not in your list yet (e.g. pork belly, chicken breast, special cut thigh, beef oxtail). <button class="sm pri" data-act="addCommonItems" style="margin-left:6px">Review &amp; add</button></div></div>` : ''}
   <div class="kpis"><div class="kpi"><span>Stock value (at last cost)</span><b>${peso(totalVal)}</b></div><div class="kpi"><span>Items below par</span><b>${activeItems().filter(i => num(i.par?.[b]) > 0 && (st[i.id] || 0) < num(i.par[b])).length}</b></div><div class="kpi"><span>Last count</span><b>${counts.find(live_) ? fmtD(counts.find(live_).date) : '—'}</b></div></div>
   ${rows.length ? `<div class="tw"><table class="stock-t"><thead><tr><th>Item</th><th class="n">On hand</th><th>Unit</th><th class="n">Par</th><th class="n">Last cost</th><th class="n">Value</th><th>Counted</th><th style="width:${S.isAdmin ? 140 : 70}px">Actions</th></tr></thead>
    ${ITEM_CATS.map(cat => { const its = rows.filter(i => catOf(i) === cat); if (!its.length) return '';
      const val = sum(its, i => Math.max(0, st[i.id] || 0) * costOf(i.id));
      return `<tbody><tr class="cat-h"><th colspan="8"><span>${esc(cat)}</span><span class="small mut">${its.length} item${its.length === 1 ? '' : 's'} · ${peso(val)}</span></th></tr>
      ${its.map(i => { const oh = st[i.id] || 0, par = num(i.par?.[b]); return `<tr><td>${esc(i.name)}</td><td class="n ${oh < -0.001 ? 'bad-t' : par && oh < par ? 'warn-t' : ''}">${fq(oh)}</td><td class="mut">${esc(i.unit)}</td><td class="n mut">${par ? fq(par) : ''}</td><td class="n">${peso(i.lastCost)}</td><td class="n">${peso(Math.max(0, oh) * costOf(i.id))}</td><td class="small mut">${sinceDate[i.id] ? fmtD(sinceDate[i.id]) : 'never'}</td><td class="acts"><button class="sm" data-act="reqItem" data-arg="${i.id}" title="Add to a purchase request">${inReq.has(i.id) ? '✓ In PR' : '＋ PR'}</button>${S.isAdmin ? `<button class="sm" data-act="editItem" data-arg="${i.id}" aria-label="Edit ${esc(i.name)}">✎ Edit</button>` : ''}</td></tr>`; }).join('')}</tbody>`; }).join('')}
   </table></div>` : `<div class="empty">No items yet.${S.isAdmin ? ' Click <b>＋ Add item</b> to start.' : ''}</div>`}
  </div>
  <div class="card"><h3>Count history · ${BOOK[b].name}</h3>
   ${counts.length ? `<div class="tw"><table><thead><tr><th>Date</th><th>Counted by</th><th class="n">Items</th><th class="n">Missing (value)</th><th class="n">Excess (value)</th><th class="n">Net variance</th><th></th></tr></thead><tbody>
    ${counts.map(c => `<tr class="click ${c.status === 'void' ? 'void' : ''}" data-act="viewCount" data-arg="${c.id}"><td>${fmtD(c.date)}</td><td>${esc(c.by)}${c.witness ? `<div class="small mut">witness ${esc(c.witness)}</div>` : ''}</td><td class="n">${(c.lines || []).length}</td><td class="n ${num(c.lossValue) < -1 ? 'bad-t' : ''}">${peso(c.lossValue)}</td><td class="n">${peso(c.gainValue)}</td><td class="n">${peso(c.varianceValue)}</td><td>${voidBtn('counts', c)}</td></tr>`).join('')}
   </tbody></table></div>` : '<div class="empty">No counts yet. Your first count sets the opening stock.</div>'}
  </div>`;
};
function countSheet() {
  const c = D.count, blind = c.blind;
  const q = (c.q || '').toLowerCase(), only = c.cat || '';
  const show = (l) => (!q || iname(l.itemId).toLowerCase().includes(q)) && (!only || catOf(S.items[l.itemId]) === only);
  return `<h2>Physical count · ${BOOK[c.book].name}</h2>
  <p class="lede">Count what is physically on the shelf, chiller and freezer. ${blind ? '<b>Blind count is on:</b> the expected quantity is hidden so the counter can\'t just copy it. Variances show after posting.' : ''} Items left blank are skipped and keep their expected quantity.</p>
  <div class="card"><div class="grid">
    <label>Count date<input type="date" data-b="count.date"></label>
    <label>Counted by<input list="dl-staff" data-b="count.by"></label>
    <label>Witness<input list="dl-staff" data-b="count.witness" placeholder="Second person"></label>
    <label>Find item<input data-b="count.q" data-rr placeholder="Search…"></label>
    <label>Count only<select data-b="count.cat" data-rr>${opt('', 'All categories')}${ITEM_CATS.filter(k => c.lines.some(l => catOf(S.items[l.itemId]) === k)).map(k => opt(k, k)).join('')}</select></label>
   </div>
   <div class="row" style="margin-bottom:8px"><label class="row" style="flex-direction:row;gap:6px"><input type="checkbox" data-b="count.blind" data-rr> Blind count (hide expected quantities)</label><span class="spacer"></span><span class="small mut"><b data-live="counted">${c.lines.filter(l => l.actual !== '').length}</b> of ${c.lines.length} counted</span></div>
   <p class="small mut" style="margin:0 0 8px">Tip: count high-value items (Poultry, Pork, Beef, Fish/Seafood) often. Pantry Essentials can be counted less often; uncounted items keep their expected quantity.</p>
   <div class="tw"><table class="lines stock-t"><thead><tr><th>Item</th><th>Unit</th>${blind ? '' : '<th class="n">Expected</th>'}<th class="n" style="width:120px">Actual count</th>${blind ? '' : '<th class="n">Variance</th>'}</tr></thead><tbody>
    ${c.lines.map((l, i) => show(l) ? `${(i === 0 || catOf(S.items[c.lines[i - 1].itemId]) !== catOf(S.items[l.itemId])) ? `<tr class="cat-h"><th colspan="${blind ? 3 : 5}"><span>${esc(catOf(S.items[l.itemId]))}</span></th></tr>` : ''}<tr><td>${esc(iname(l.itemId))}</td><td class="mut">${esc(iunit(l.itemId))}</td>${blind ? '' : `<td class="n">${fq(l.system)}</td>`}<td><input type="number" inputmode="decimal" step="any" min="0" data-b="count.lines.${i}.actual" style="text-align:right"></td>${blind ? '' : `<td class="n" data-live="cvar:${i}"></td>`}</tr>` : '').join('')}
   </tbody></table></div>
   <div class="row end" style="margin-top:12px"><button class="ghost" data-act="cancelCount">Discard count</button><button class="pri" data-act="postCount">Post count</button></div>
  </div>`;
}

/* ============ EVENTS ============ */
V.events = () => {
  if (D.ui.eventId && S.events[D.ui.eventId]) return eventDetail(S.events[D.ui.eventId]);
  const evs = Object.values(S.events).sort((a, b) => b.date.localeCompare(a.date));
  return `<h2>Catering events</h2>
  <p class="lede">Each event is its own cost centre. Plan the menu quantities, buy against the plan, issue to the event, return leftovers, then compare what was planned, bought and used, and what the event actually cost against the contract.</p>
  <div class="card"><h3>New event</h3>
   <div class="grid">
    <label>Event name<input data-b="event.name" placeholder="e.g. Santos wedding"></label>
    <label>Client<input data-b="event.client"></label>
    <label>Event date<input type="date" data-b="event.date"></label>
    <label>Pax<input type="number" inputmode="numeric" min="0" data-b="event.pax"></label>
    <label>Contract price ₱<input type="number" inputmode="decimal" min="0" step="any" data-b="event.contract"></label>
    <label>Venue<input data-b="event.venue"></label>
   </div>
   <label>Menu / notes<textarea data-b="event.notes" placeholder="Menu, package, special requests"></textarea></label>
   <div class="row end" style="margin-top:10px"><button class="pri" data-act="saveEv">Create event</button></div>
  </div>

  <div class="card"><h3>Lists</h3>
   <div class="grid"><label>Business name (printed on forms)<input data-b="cfg.company"></label><label>Address / contact line<input data-b="cfg.address" placeholder="Street, city · phone"></label></div>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
    <label>Departments (one per line)<textarea data-b="cfg.departments"></textarea></label>
    <label>Other names for buyer / receiver lists (one per line)<textarea data-b="cfg.staff" placeholder="Helpers without a login"></textarea></label>
    <label>Suppliers / stalls (one per line)<textarea data-b="cfg.suppliers"></textarea></label>
    <label>Expense categories (one per line)<textarea data-b="cfg.expCats"></textarea></label>
   </div>
   <div class="row"><label style="max-width:240px">Flag price increases above (%)<input type="number" min="1" step="1" data-b="cfg.pct"></label><span class="spacer"></span><button class="pri" data-act="saveCfg">Save lists</button></div>
  </div>
  <div class="card"><h3>Logins & roles</h3>
   <p class="small">Logins come from the <b>Romualdos Staff Logins</b> file in the Romualdo's Inquiry App folder on Google Drive, the same file used for the inquiry dashboard. Add a row to give someone access, set <b>Role</b> to Admin or Staff, and set <b>Active = No</b> to block them (takes effect within 2 minutes).</p>
   <p class="small"><b>Staff</b> can file requisitions, record advances, purchases, receiving, expenses, issues, waste and counts, liquidate advances, and print. <b>Admins</b> can also approve or reject requisitions, void records, change saved amounts, edit items and this Setup page. The server enforces these rules, not just the screen.</p>
   <div class="tw"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th></tr></thead><tbody>${S.users.filter(u => u.active !== false).map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${u.role === 'Admin' ? '<span class="chip c">Admin</span>' : '<span class="chip mut">Staff</span>'}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><h3>How to run it day to day</h3>
   <ol class="steps">
    <li><b>Request first:</b> the cook or storekeeper files a <a href="#prs">requisition</a>; an Admin approves it and it is printed for the buyer.</li>
    <li><b>Before market:</b> the cashier records a <a href="#advances">cash advance</a> to the buyer, charged to Restaurant or Catering. Separate advances for each.</li>
    <li><b>At the market:</b> the buyer keeps every receipt (or writes the stall name and price) and records each <a href="#purchases">purchase</a> on their phone, against the advance.</li>
    <li><b>On arrival:</b> a different person (storekeeper or head cook) weighs and counts the goods and taps <b>Receive</b>. Shortages are flagged automatically.</li>
    <li><b>Same day:</b> the buyer returns the change and the cashier <b>liquidates</b> the advance. It must balance to zero.</li>
    <li><b>Every issue out of the storeroom</b> goes through <a href="#usage">Issue & waste</a>, with a releaser and a receiver. Catering issues name the event; leftovers come back as returns.</li>
    <li><b>Spoilage</b> is written off with a reason and a witness, never just thrown out.</li>
    <li><b>Count</b> high-value items (meat, seafood) daily and everything weekly, using blind count with a witness. Rotate who counts.</li>
    <li><b>Owner review:</b> check the Dashboard daily and Reports weekly. Look at short deliveries, price jumps, unbalanced liquidations, voids and count variances.</li>
   </ol>
   <p class="small mut">Records are never deleted, only voided with a reason and the name of whoever voided it. Enter purchases and issues <i>before</i> starting a count: anything recorded after a count is posted is treated as happening after it. The app reads the latest 1,000 records of each type, so count each storeroom at least monthly.</p>
  </div>`;
};

const prTotal = (lines, appr) => sum(lines || [], l => num(appr && l.apprQty != null ? l.apprQty : l.qty) * num(l.cost));

   <p class="small mut" style="margin-bottom:0">"On hand" is filled in from the ${BOOK[d.book].name.toLowerCase()} storeroom stock automatically, so the approver can see if it's really needed.</p>

function closeModal() { $('#modal').classList.remove('open'); $('#mbox').innerHTML = ''; MH = {}; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); const b = e.target.closest('[data-mact]'); if (!b) return; const k = b.dataset.mact; if (k === 'close') closeModal(); else MH[k]?.(b); });
let tT; function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(tT); tT = setTimeout(() => t.style.display = 'none', err ? 5000 : 2600); }
const mBtns = (save = 'Save', extra = '') => `<div class="row end" style="margin-top:14px">${extra}<button data-mact="close">Cancel</button><button class="pri" data-mact="save">${save}</button></div>`;

/* ============ writes ============ */
function needDb() { if (!S.me) { toast('Please log in.', true); return false; } return true; }
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
async function opsWrite(ops) { const r = await api('opsWrite', {ops}); applyDocs(r.docs, false); return r; }
async function addDoc(coll, data) { const id = genId(); await opsWrite([{op: 'add', path: coll + '/' + id, data}]); return id; }
const upd = (path, data) => opsWrite([{op: 'update', path, data}]);
const setDoc = (path, data) => opsWrite([{op: 'set', path, data}]);
async function guard(fn, ok) {
  if (S.busy || !needDb()) return false; S.busy = true; document.body.style.cursor = 'progress'; toast('Saving…');
  try { await fn(); if (ok) toast(ok); return true; }
  catch (e) { console.error(e); if (!e.auth) toast('Not saved: ' + (e?.message || e), true); return false; }
  finally { S.busy = false; document.body.style.cursor = ''; render(); }
}

/* ============ actions ============ */
ACT.set = a => { const i = a.indexOf('|'); setPath(D, a.slice(0, i), a.slice(i + 1)); render(); };
ACT.more = k => { D.ui.showAll[k] = (D.ui.showAll[k] || 40) + 100; render(); };
ACT.addLine = k => { D[k].lines.push({itemId: '', qty: '', ...(k === 'purchase' || k === 'req' ? {cost: ''} : {})}); render(); };
ACT.rmLine = a => { const [k, i] = a.split('|'); D[k].lines.splice(+i, 1); if (!D[k].lines.length) ACT.addLine(k); else render(); };
ACT.resetP = () => { D.purchase = newPurchase({book: D.purchase.book}); render(); };
ACT.resetM = () => { D.move = newMove({book: D.move.book}); render(); };

ACT.saveAdv = () => {
  const d = D.advance;
  if (!d.to.trim() || !(num(d.amount) > 0)) return toast('Enter who received the cash and the amount.', true);
  guard(async () => { await addDoc('advances', {date: d.date, book: d.book, eventId: d.book === 'C' ? d.eventId : '', to: d.to.trim(), amount: r2(num(d.amount)), givenBy: d.givenBy.trim(), note: d.note.trim(), status: 'open'}); D.advance = newAdvance({book: d.book, givenBy: d.givenBy}); }, 'Cash advance recorded');
};
ACT.liquidate = id => {
  const a = S.advances.find(x => x.id === id); if (!a) return;
  const s = advanceSpent(id), expect = num(a.amount) - s.spent, done = a.status === 'liquidated';
  openModal(`<h3>${done ? 'Liquidation' : 'Liquidate cash advance'}</h3>
   <p class="mut">${esc(a.to)} · ${chipBook(a.book, a.eventId)} · ${fmtD(a.date)}</p>
   <table><tbody>
    ${s.ps.map(p => `<tr><td>Purchase · ${esc(p.supplier || '—')}${p.receiptNo ? '' : ' <span class="chip warn">no receipt</span>'}</td><td class="n">${peso(p.total)}</td></tr>`).join('')}
    ${s.es.map(e => `<tr><td>Expense · ${esc(e.cat)} ${esc(e.desc)}${e.receiptNo ? '' : ' <span class="chip warn">no receipt</span>'}</td><td class="n">${peso(e.amount)}</td></tr>`).join('')}
    ${!s.ps.length && !s.es.length ? '<tr><td colspan="2" class="mut">No purchases or expenses were recorded against this advance.</td></tr>' : ''}
   </tbody><tfoot><tr><td>Cash advance</td><td class="n">${peso(a.amount)}</td></tr><tr><td>Less: recorded spending</td><td class="n">${peso(s.spent)}</td></tr><tr><td>Change that must be returned</td><td class="n">${peso(expect)}</td></tr></tfoot></table>
   ${done ? `<p>Change returned: <b>${peso(a.change)}</b> · received by ${esc(a.liqBy || '—')} · ${fmtT(a.liqAt)}<br>Unaccounted: <b class="${Math.abs(num(a.diff)) >= 1 ? 'bad-t' : 'ok-t'}">${Math.abs(num(a.diff)) >= 1 ? peso(a.diff) : 'none — balanced'}</b></p>${a.liqNote ? `<p class="small">${esc(a.liqNote)}</p>` : ''}<div class="row end"><button data-mact="close">Close</button></div>` : `
   <div class="grid" style="margin-top:12px"><label>Cash actually returned ₱<input id="m-chg" type="number" inputmode="decimal" step="any" min="0" value="${Math.max(0, r2(expect))}"></label><label>Received by<input id="m-by" list="dl-staff"></label></div>
   <div id="m-diff" class="alert"></div>
   <label>Explanation (required if it doesn't balance)<input id="m-note"></label>
   ${mBtns('Liquidate')}`}`,
   {save: () => {
     const chg = num($('#m-chg').value), diff = r2(num(a.amount) - s.spent - chg), note = $('#m-note').value.trim(), by = $('#m-by').value.trim();
     if (!by) return toast('Who received the change?', true);
     if (Math.abs(diff) >= 1 && !note) return toast('It doesn\'t balance — add an explanation.', true);
     guard(async () => { await upd('advances/' + id, {status: 'liquidated', change: r2(chg), spent: r2(s.spent), diff, liqNote: note, liqBy: by, liqAt: Date.now()}); closeModal(); }, Math.abs(diff) >= 1 ? 'Liquidated — flagged as not balanced' : 'Liquidated — balanced');
   }},
   box => { const upd = () => { const el = box.querySelector('#m-diff'); if (!el) return; const diff = r2(num(a.amount) - s.spent - num(box.querySelector('#m-chg').value)); el.className = 'alert ' + (Math.abs(diff) < 1 ? 'ok' : 'bad'); el.innerHTML = Math.abs(diff) < 1 ? '✓ Balanced' : diff > 0 ? `Short by <b>${peso(diff)}</b>: cash not returned and not covered by recorded purchases.` : `Over by <b>${peso(-diff)}</b>: recorded spending exceeds the advance (buyer used own money?).`; };
     box.querySelector('#m-chg')?.addEventListener('input', upd); upd(); });
};

ACT.unlinkPR = () => { D.purchase.prId = ''; D.purchase.prNo = ''; render(); };
ACT.saveP = () => {
  const d = D.purchase, lines = d.lines.filter(l => l.itemId && num(l.qty) > 0);
  if (!lines.length) return toast('Add at least one item with a quantity.', true);
  if (lines.some(l => !(num(l.cost) > 0))) return toast('Enter the unit cost for every line.', true);
  if (!d.buyer.trim()) return toast('Who bought it?', true);
  if (d.lines.some(l => l.itemId && !(num(l.qty) > 0))) return toast('Some lines have no quantity.', true);
  guard(async () => {
    const id = genId(), total = r2(sum(lines, l => num(l.qty) * num(l.cost)));
    const ops = [{op: 'add', path: 'purchases/' + id, data: {date: d.date, book: d.book, eventId: d.book === 'C' ? d.eventId : '', supplier: d.supplier.trim(), buyer: d.buyer.trim(), receiptNo: d.receiptNo.trim(), advanceId: d.advanceId, prId: d.prId || '', prNo: d.prNo || '',
      lines: lines.map(l => ({itemId: l.itemId, qty: num(l.qty), cost: num(l.cost), prevCost: costOf(l.itemId)})), total, status: 'pending'}}];
    const pr = d.prId && S.prs.find(x => x.id === d.prId);
    if (pr && pr.status === 'approved') ops.push({op: 'update', path: 'prs/' + pr.id, data: {status: 'purchased', actual: {date: d.date, by: d.buyer.trim(), amount: total, receipt: d.receiptNo.trim(), purchaseId: id, at: Date.now()}}});
    await opsWrite(ops);
    D.purchase = newPurchase({book: d.book, date: d.date, buyer: d.buyer, advanceId: d.advanceId, eventId: d.eventId});
  }, 'Purchase saved — waiting to be received');
};
function purchaseTable(p, recvInputs) {
  return `<div class="tw"><table><thead><tr><th>Item</th><th class="n">Bought</th>${p.status !== 'pending' || recvInputs ? '<th class="n">Received</th>' : ''}<th class="n">Unit cost</th><th class="n">Amount</th></tr></thead><tbody>
   ${p.lines.map((l, i) => { const j = priceJump(l, l.prevCost); const rq = recvQty(p, i); return `<tr><td>${esc(iname(l.itemId))}${Math.abs(j) > pctAlert() ? ` <span class="chip ${j > 0 ? 'bad' : 'info'}">${j > 0 ? '▲' : '▼'} ${Math.abs(j).toFixed(0)}% vs ${peso(l.prevCost)}</span>` : ''}</td><td class="n">${fq(l.qty)} ${esc(iunit(l.itemId))}</td>
    ${recvInputs ? `<td><input class="m-rq" data-i="${i}" type="number" inputmode="decimal" step="any" min="0" value="${l.qty}" style="width:100px;text-align:right"></td>` : p.status === 'received' ? `<td class="n ${rq < l.qty - 0.001 ? 'bad-t' : ''}">${fq(rq)}</td>` : ''}
    <td class="n">${peso(l.cost)}</td><td class="n">${peso(l.qty * l.cost)}</td></tr>`; }).join('')}
  </tbody><tfoot><tr><td colspan="${p.status !== 'pending' || recvInputs ? 4 : 3}">Total</td><td class="n">${peso(p.total)}</td></tr></tfoot></table></div>`;
}
ACT.viewP = id => {
  const p = S.purchases.find(x => x.id === id); if (!p) return;
  openModal(`<h3>Purchase · ${esc(p.supplier || 'no supplier')}</h3>
   <p class="mut">${fmtD(p.date)} · ${chipBook(p.book, p.eventId)} · bought by <b>${esc(p.buyer)}</b> · receipt ${p.receiptNo ? esc(p.receiptNo) : '<span class="chip warn">none</span>'}${p.advanceId ? ' · from cash advance' : ''}</p>
   ${purchaseTable(p)}
   <p class="small mut">Entered ${fmtT(p.createdAt)}${who(p.createdBy) ? ' by ' + esc(who(p.createdBy)) : ''}.
   ${p.status === 'received' ? ` Received by <b>${esc(p.recv?.by)}</b> ${fmtT(p.recv?.at)}.${p.recv?.note ? ' Note: ' + esc(p.recv.note) : ''}` : ''}
   ${p.status === 'void' ? ` <span class="bad-t">Voided:</span> ${esc(p.voidReason)} (${esc(p.voidByName || '')}, ${fmtT(p.voidAt)})` : ''}</p>
   <div class="row end">${p.status === 'pending' ? `<button class="pri" data-mact="recv">Receive now</button>` : ''}<button data-mact="close">Close</button></div>`, {recv: () => ACT.receive(id)});
};
ACT.receive = id => {
  const p = S.purchases.find(x => x.id === id); if (!p || p.status !== 'pending') return;
  openModal(`<h3>Receive purchase</h3>
   <p class="mut">${fmtD(p.date)} · ${chipBook(p.book, p.eventId)} · ${esc(p.supplier || '—')} · bought by <b>${esc(p.buyer)}</b></p>
   <div class="alert info"><span class="ic">i</span><div>Weigh or count every item now. Change the received quantity if it's less than what the buyer recorded. Only the received quantity goes into stock.</div></div>
   ${purchaseTable(p, true)}
   <div class="grid" style="margin-top:10px"><label>Received by<input id="m-by" list="dl-staff"></label><label>Note<input id="m-note" placeholder="e.g. 0.3kg short on pork, wilted pechay"></label></div>
   <div id="m-warn"></div>
   ${mBtns('Confirm received')}`,
   {save: () => {
     const by = $('#m-by').value.trim(); if (!by) return toast('Enter who received the goods.', true);
     const qty = [...document.querySelectorAll('.m-rq')].map(el => num(el.value));
     guard(async () => {
       const ops = [{op: 'update', path: 'purchases/' + id, data: {status: 'received', recv: {by, at: Date.now(), qty, note: $('#m-note').value.trim()}}}];
       const seen = {}; p.lines.forEach(l => { if (S.items[l.itemId] && num(l.cost) > 0 && num(S.items[l.itemId].lastCost) !== num(l.cost)) seen[l.itemId] = num(l.cost); });
       Object.entries(seen).forEach(([iid, c]) => ops.push({op: 'update', path: 'items/' + iid, data: {lastCost: c}}));
       await opsWrite(ops);
       closeModal();
     }, 'Received into ' + BOOK[p.book].name + ' stock');
   }},
   box => { const by = box.querySelector('#m-by'); by.addEventListener('input', () => { box.querySelector('#m-warn').innerHTML = by.value.trim() && by.value.trim().toLowerCase() === (p.buyer || '').trim().toLowerCase() ? '<div class="alert warn"><span class="ic">⚠</span><div>The receiver is the same person as the buyer. This will be flagged for the owner.</div></div>' : ''; }); });
};

ACT.saveE = () => {
  const d = D.expense;
  if (!d.cat || !(num(d.amount) > 0)) return toast('Choose a category and enter the amount.', true);
  guard(async () => { await addDoc('expenses', {date: d.date, book: d.book, eventId: d.book === 'C' ? d.eventId : '', cat: d.cat, desc: d.desc.trim(), amount: r2(num(d.amount)), paidBy: d.paidBy.trim(), receiptNo: d.receiptNo.trim(), advanceId: d.advanceId, status: 'ok'}); D.expense = newExpense({book: d.book, date: d.date, paidBy: d.paidBy, advanceId: d.advanceId, eventId: d.eventId}); }, 'Expense saved');
};

ACT.saveM = () => {
  const d = D.move, lines = d.lines.filter(l => l.itemId && num(l.qty) > 0);
  if (!lines.length) return toast('Add at least one item with a quantity.', true);
  if (d.book === 'C' && (d.type === 'issue' || d.type === 'return') && !d.eventId) return toast('Choose the event.', true);
  if (d.type === 'waste' && !d.reason) return toast('Choose a waste reason.', true);
  if (!d.by.trim() || !d.receivedBy.trim()) return toast('Enter both names (released by and received / witnessed by).', true);
  guard(async () => {
    await addDoc('moves', {date: d.date, book: d.book, type: d.type, toBook: d.type === 'transfer' ? (d.book === 'R' ? 'C' : 'R') : '', eventId: d.book === 'C' && (d.type === 'issue' || d.type === 'return') ? d.eventId : '',
      by: d.by.trim(), receivedBy: d.receivedBy.trim(), reason: d.type === 'waste' ? d.reason : '', note: d.note.trim(), lines: lines.map(l => ({itemId: l.itemId, qty: num(l.qty), cost: costOf(l.itemId)})), status: 'ok'});
    D.move = newMove({book: d.book, type: d.type, date: d.date, by: d.by, eventId: d.eventId});
  }, 'Saved');
};

ACT.void = a => {
  const [coll, id] = a.split('|'); const x = (S[coll] || []).find(r => r.id === id); if (!x) return;
  if (coll === 'purchases' && x.advanceId && S.advances.find(v => v.id === x.advanceId)?.status === 'liquidated') return toast('This purchase is part of a liquidated advance and can\'t be voided.', true);
  openModal(`<h3>Void this record?</h3><p class="mut">It stays visible, struck through, with your reason and name. Its quantities and amounts stop counting.</p>
   <label>Reason<input id="m-r" placeholder="e.g. Entered twice"></label><input id="m-n" type="hidden" value="${esc(S.me?.name || S.me?.username || '')}">${mBtns('Void record')}`,
   {save: () => { const r = $('#m-r').value.trim(), n = $('#m-n').value.trim(); if (!r || !n) return toast('Reason and name are required.', true);
     guard(async () => { await upd(coll + '/' + id, {status: 'void', voidReason: r, voidByName: n}); closeModal(); }, 'Voided'); }});
};

ACT.startCount = () => {
  const b = D.ui.stockBook, {st} = stockFor(b);
  D.count = {book: b, date: today(), by: '', witness: '', blind: true, q: '', lines: activeItems().map(i => ({itemId: i.id, system: r2(st[i.id] || 0), actual: ''}))};
  if (!D.count.lines.length) { D.count = null; return toast('Add items in Setup first.', true); }
  render(); window.scrollTo(0, 0);
};
ACT.cancelCount = () => { D.count = null; render(); };
ACT.postCount = () => {
  const c = D.count, lines = c.lines.filter(l => l.actual !== '' && l.actual != null);
  if (!lines.length) return toast('Enter at least one counted quantity.', true);
  if (!c.by.trim()) return toast('Enter who counted.', true);
  const {st} = stockFor(c.book);  // recompute in case transactions came in meanwhile
  const L = lines.map(l => ({itemId: l.itemId, system: r2(st[l.itemId] || 0), actual: num(l.actual), cost: costOf(l.itemId)}));
  const vv = L.map(l => (l.actual - l.system) * l.cost), loss = r2(sum(vv.filter(v => v < 0), v => v)), gain = r2(sum(vv.filter(v => v > 0), v => v));
  guard(async () => {
    const id = await addDoc('counts', {date: c.date, book: c.book, by: c.by.trim(), witness: c.witness.trim(), lines: L, varianceValue: r2(loss + gain), lossValue: loss, gainValue: gain, status: 'ok'});
    D.count = null; setTimeout(() => ACT.viewCount(id, {date: c.date, book: c.book, by: c.by, lines: L, lossValue: loss, gainValue: gain, varianceValue: r2(loss + gain)}), 100);
  }, 'Count posted');
};
ACT.viewCount = (id, fallback) => {
  const c = S.counts.find(x => x.id === id) || fallback; if (!c) return;
  const v = (c.lines || []).map(l => ({...l, d: l.actual - l.system, val: (l.actual - l.system) * l.cost})).filter(l => Math.abs(l.d) > 0.001).sort((a, b) => a.val - b.val);
  openModal(`<h3>Count result · ${BOOK[c.book].name} · ${fmtD(c.date)}</h3><p class="mut">Counted by ${esc(c.by)}${c.witness ? ', witness ' + esc(c.witness) : ''} · ${(c.lines || []).length} items</p>
   <div class="kpis"><div class="kpi bad"><span>Missing</span><b>${peso(c.lossValue)}</b></div><div class="kpi"><span>Excess</span><b>${peso(c.gainValue)}</b></div><div class="kpi"><span>Net</span><b>${peso(c.varianceValue)}</b></div></div>
   ${v.length ? `<div class="tw"><table><thead><tr><th>Item</th><th class="n">Expected</th><th class="n">Actual</th><th class="n">Difference</th><th class="n">Value</th></tr></thead><tbody>${v.map(l => `<tr><td>${esc(iname(l.itemId))}</td><td class="n">${fq(l.system)}</td><td class="n">${fq(l.actual)}</td><td class="n ${l.d < 0 ? 'bad-t' : 'ok-t'}">${l.d > 0 ? '+' : ''}${fq(l.d)} ${esc(iunit(l.itemId))}</td><td class="n">${peso(l.val)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="alert ok"><span class="ic">✓</span><div>Everything matched.</div></div>'}
   <p class="small mut">Missing stock means it left the storeroom without an issue or waste record. Ask who had access, check for unrecorded issues, and recount big differences.</p>
   <div class="row end"><button data-mact="close">Close</button></div>`);
};

ACT.saveEv = () => {
  const d = D.event; if (!d.name.trim() || !d.date) return toast('Enter the event name and date.', true);
  guard(async () => { const id = await addDoc('events', {name: d.name.trim(), client: d.client.trim(), date: d.date, pax: num(d.pax) || '', contract: r2(num(d.contract)), venue: d.venue.trim(), notes: d.notes.trim(), status: 'planned', plan: []}); D.event = newEvent(); D.ui.eventId = id; D.plan = null; }, 'Event created — now plan the menu quantities');
};
ACT.openEvent = id => { D.ui.eventId = id; D.plan = null; if (D.ui.tab !== 'events') location.hash = 'events'; else render(); window.scrollTo(0, 0); };
ACT.closeEvent = () => { D.ui.eventId = ''; D.plan = null; render(); };
ACT.evStatus = st => guard(async () => { await upd('events/' + D.ui.eventId, {status: st}); }, 'Event ' + st);
ACT.savePlan = () => {
  const lines = D.plan.lines.filter(l => l.itemId && num(l.qty) > 0).map(l => ({itemId: l.itemId, qty: num(l.qty)}));
  guard(async () => { await upd('events/' + D.plan.eventId, {plan: lines}); }, 'Menu plan saved');
